name: Construir APK y extensión de Rumia

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Revisar Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalar
        run: npm install --legacy-peer-deps

      - name: Lector de Excel sin internet
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/

      - name: Crear la app Android
        run: npx cap add android

      - name: Ícono con el logo
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'

      - name: Copiar la app
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Rumia.apk

      - name: Armar la extensión de Chrome
        run: |
          cp node_modules/xlsx/dist/xlsx.full.min.js extension/
          cd extension && zip -r ../Rumia-Chrome.zip . && cd ..

      - uses: actions/upload-artifact@v5
        with:
          name: Rumia-APK
          path: Rumia.apk

      - name: Publicar para descargar desde el teléfono
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version Rumia.apk Rumia-Chrome.zip --title "Rumia (última versión)" --notes "Rumia.apk: app para Android. Rumia-Chrome.zip: extensión de Chrome para leer los monitoreos web (descomprimir y cargar en chrome://extensions con el modo de desarrollador)." --latest
