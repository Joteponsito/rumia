name: Construir APK de Rumia

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Instalar
        run: npm install --legacy-peer-deps

      - name: Lector de Excel sin internet
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/

      - name: Crear la app Android
        run: npx cap add android

      - name: Ícono con el logo
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'

      - name: Copiar la app
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Rumia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rumia-APK
          path: Rumia.apk
