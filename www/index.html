<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de celular centrada; encabezado con logo Dos Banderas, pantallas por pestaña, barra inferior fija. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --sunk:#e8ece5; --ink:#141c17; --muted:#59665e; --line:#d9dfd5;
  --accent:#1c8139; --accent-ink:#ffffff; --brand-red:#d42a2f; --straw:#c27f17; --straw-soft:#f6e9cf;
  --crit:#b9352b; --crit-soft:#f8e0dc; --warn:#a2660c; --warn-soft:#f5e8cf; --ok:#2a7a4c; --ok-soft:#dbefe1; --info:#2d5e8c; --info-soft:#dde7f1;
  --c4:#7a52b3; --c5:#16858a; --c6:#7b7f86; --logo-tile:#ffffff;
  --fert:#8a4fc4; --fert-ink:#5b2a8c; --fert-soft:#efe4fa; --ind1:#e0761b; --ind2:#3d4fb5;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1310; --surface:#161d19; --sunk:#1e2722; --ink:#e6ebe5; --muted:#98a69d; --line:#29342d;
  --accent:#5fcf7d; --accent-ink:#0b1a10; --brand-red:#f06a62; --straw:#e3b55b; --straw-soft:#392d15;
  --crit:#f07f6d; --crit-soft:#3c1e1a; --warn:#e8b45c; --warn-soft:#372912; --ok:#74c995; --ok-soft:#163022; --info:#8db8e2; --info-soft:#192836;
  --c4:#b597e6; --c5:#5cc8cc; --c6:#a3a8ae; --logo-tile:#f4f6f2;
  --fert:#b88ae8; --fert-ink:#dcc6f5; --fert-soft:#2c2038; --ind1:#f5a04f; --ind2:#93a3f5;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1310; --surface:#161d19; --sunk:#1e2722; --ink:#e6ebe5; --muted:#98a69d; --line:#29342d;
  --accent:#5fcf7d; --accent-ink:#0b1a10; --brand-red:#f06a62; --straw:#e3b55b; --straw-soft:#392d15;
  --crit:#f07f6d; --crit-soft:#3c1e1a; --warn:#e8b45c; --warn-soft:#372912; --ok:#74c995; --ok-soft:#163022; --info:#8db8e2; --info-soft:#192836;
  --c4:#b597e6; --c5:#5cc8cc; --c6:#a3a8ae; --logo-tile:#f4f6f2;
  --fert:#b88ae8; --fert-ink:#dcc6f5; --fert-soft:#2c2038; --ind1:#f5a04f; --ind2:#93a3f5;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:600px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(140px + env(safe-area-inset-bottom,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Encabezado */
.top{display:flex;align-items:center;gap:12px;padding-block:16px 8px}
.logo{flex:none;background:var(--logo-tile);border-radius:12px;padding:4px 6px;border:1px solid var(--line);display:block}
.logo img{display:block;height:46px;width:auto}
.top .grow{flex:1;min-width:0}
.top h1{font-family:var(--font-display);font-size:1.12rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--muted);font-size:.8rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.src{font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--straw-soft);color:var(--straw)}
.src.real{background:var(--ok-soft);color:var(--ok)}
.iconbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hello{font-family:var(--font-display);font-size:1.65rem;line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:12px 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px}
h2{font-family:var(--font-display);font-size:1.08rem;font-weight:700;margin:26px 0 10px;letter-spacing:-.005em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 .count{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:600}
.label{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .v small{font-family:var(--font-body);font-size:.8rem;font-weight:500;color:var(--muted)}
.kpi .d{font-size:.8rem;margin-top:2px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--crit)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
/* Gráficos interactivos */
.chartbox{position:relative;touch-action:pan-y}
.chart{width:100%;height:auto;display:block;cursor:crosshair;user-select:none;-webkit-user-select:none}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font-body)}
.tip{position:absolute;top:0;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;
  font-size:.8rem;line-height:1.35;min-width:110px;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap}
.tip b{display:block;font-size:.85rem;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lg{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--ink)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.legend.static span{font-size:.8rem;color:var(--muted)} .legend.static i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hint{font-size:.75rem;color:var(--muted);margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--surface);padding:4px 11px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Listas */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.tag{flex:none;min-width:52px;height:40px;padding:0 6px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1rem;background:var(--sunk)}
.tag.alta{background:var(--crit-soft);color:var(--crit)} .tag.media{background:var(--warn-soft);color:var(--warn)}
.tag.info{background:var(--info-soft);color:var(--info)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:.82rem;color:var(--muted)}
.row .end{flex:none;text-align:right;font-size:.82rem;color:var(--muted)}
.row .end b{display:block;color:var(--ink);font-size:.95rem}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px;margin-right:4px;letter-spacing:.02em}
.pill.alta{background:var(--crit-soft);color:var(--crit)} .pill.media{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:16px;color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ask .chips .chip{padding:6px 11px;font-size:.8rem}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;color:var(--ink);margin-bottom:10px}
.bar-row{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:.85rem;padding:5px 0}
.bar{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px}
.note{font-size:.82rem;color:var(--muted);margin-top:8px}
.mini{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;cursor:pointer}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
/* Formularios del explorador y datos */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.03em;min-width:0}
.form select,.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:.9rem;font-weight:500;color:var(--ink);min-width:0}
.form .full{grid-column:1/-1}
.tablewrap{overflow-x:auto;margin-top:8px}
table.t{border-collapse:collapse;width:100%;font-size:.84rem}
table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td.n{text-align:right}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:10px}
details.box summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}
details.box summary::-webkit-details-marker{display:none}
details.box summary .s{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
details.box .in{padding:0 14px 14px}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:.86rem}
.maprow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:.84rem;color:var(--ink);min-width:0;width:100%}
.maprow.on span{font-weight:700}
.drop{display:block;border:2px dashed var(--line);background:var(--surface);border-radius:18px;padding:22px 18px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--ok-soft)}
.drop b{font-family:var(--font-display);font-size:1.15rem;display:block;margin-bottom:4px}
.drop .s{color:var(--muted);font-size:.86rem}
.actionsrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:p}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:.92rem;counter-increment:p}
.steps li::before{content:counter(p);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.switch{display:flex;align-items:center;gap:10px;font-size:.92rem;padding:8px 0;cursor:pointer}
.switch input{flex:none;width:20px;height:20px;accent-color:var(--accent)}
.errs{color:var(--crit);font-size:.85rem;margin-top:8px}
/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--brand-red);color:#fff;font-size:.62rem;border-radius:999px;padding:0 5px;line-height:15px;min-width:15px}
/* Ficha */
.sheet-bg{position:fixed;inset:0;background:rgba(8,14,10,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head .num{font-family:var(--font-display);font-size:2.3rem;font-weight:700;line-height:1}
.close{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.fact .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.advice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--straw);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.9rem}
/* Asistente (oculto por defecto) */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:.93rem;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.ask{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px 6px;margin-top:12px}
.ask form{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 15px;color:var(--ink)}
.ask .send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 16px;font-weight:700;cursor:pointer}
.mode{font-size:.75rem;color:var(--muted);margin-top:6px}
.fert-head{display:flex;gap:12px;align-items:flex-start}
.fert-txt{font-size:.9rem;margin-top:5px}
.fert-prob{flex:none;text-align:center;border-radius:12px;padding:6px 10px;min-width:84px}
.fert-prob span{display:block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.fert-prob b{font-family:var(--font-display);font-size:1.15rem}
.fert-prob.alta{background:var(--fert-soft);color:var(--fert-ink)} .fert-prob.media{background:var(--warn-soft);color:var(--warn)} .fert-prob.baja{background:var(--sunk);color:var(--muted)}
.fert-horas .hia b{font-family:var(--font-display);font-size:1.3rem}
.fert-horas .hia.verde{background:var(--ok-soft)} .fert-horas .hia.verde b{color:var(--ok)}
.fert-horas .hia.amarillo{background:var(--warn-soft)} .fert-horas .hia.amarillo b{color:var(--warn)}
.fert-horas .hia.rojo{background:var(--crit-soft)} .fert-horas .hia.rojo b{color:var(--crit)}
.idx-ok{color:var(--ok)} .idx-medio{color:var(--warn)} .idx-bajo{color:var(--crit)}
.fert-horas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 8px}
.fert-horas div{background:var(--sunk);border-radius:10px;padding:7px 9px;min-width:0}
.fert-horas span{display:block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fert-horas b{font-size:.84rem}
.fert-leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:6px}
.fert-leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.fert-leyenda .ico-celo{width:22px;height:17px;vertical-align:-4px;margin-right:4px}
.fert-leyenda i.semi{width:16px;height:8px;border-radius:8px 8px 0 0;background:var(--fert);opacity:.7}
.razones{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.razones li{padding-left:24px;position:relative}
.razones li::before{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700}
.razones li.si::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.razones li.no::before{content:"!";background:var(--warn-soft);color:var(--warn)}
.razones li.neutro::before{content:"·";background:var(--sunk);color:var(--muted)}
.celo-sel{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.celo-sel .chip small{font-weight:500;opacity:.8;margin-left:4px}
@media (max-width:520px){.fert-horas{grid-template-columns:1fr 1fr}}
.calor-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-top:12px;cursor:pointer;border-left:5px solid var(--ok)}
.calor-card span{font-size:.84rem;color:var(--muted)} .calor-card b{font-size:.95rem;color:var(--ink)}
.calor-card .cc-ico{flex:none;color:#e2620c} .calor-card .cc-ver{font-weight:700;color:var(--accent)}
.calor-card.c1,.calor-hoy.c1>div:last-child{border-left-color:#d9b200} .calor-card.c2,.calor-hoy.c2>div:last-child{border-left-color:#e89a00}

const nA = x => x == null || isNaN(x) ? "—" : Math.abs(x) >= 100 ? n0(x) : x.toLocaleString("es-CR",{maximumFractionDigits:1});
const pct = x => x == null || isNaN(x) ? "—" : (x*100).toLocaleString("es-CR",{maximumFractionDigits:0}) + " %";
const avg = a => { const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; };
const addDays = (dt, k) => { const x = new Date(dt); x.setDate(x.getDate()+k); return x; };
const dm = dt => dt ? String(dt.getDate()).padStart(2,"0") + "/" + String(dt.getMonth()+1).padStart(2,"0") : "—";
const dmy = dt => dm(dt) + "/" + dt.getFullYear();
const iso = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const store = { get(k, d){ try{ const v = localStorage.getItem("rumia."+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
                set(k, v){ try{ localStorage.setItem("rumia."+k, JSON.stringify(v)); }catch(e){} } };

/* ================= Estado de la app (se recalcula con demo o con los reportes del productor) ================= */
let D, U, HOY, ANIM, ORD, CON_ALERTA, PRIOR, ALTAS, NF, TOT, TOT_MD, TOT_NO, ayerTot, semana, enLeche, FECHAS_D;
const parseDM = s => { if(!s) return null; const [d,m] = s.split("/").map(Number); let y = HOY.getFullYear(); if (m > HOY.getMonth()+1) y--; return new Date(y, m-1, d); };
const daysSince = s => { const p = parseDM(s); return p ? Math.round((HOY - p)/864e5) : null; };
const SEV = {alta:3, media:2, info:1};

function analizar(a){
  const al = [];
  if (a.grupo === "Ordeño"){
    const L = a.leche || [], R = a.rumia || [], n = L.length;
    const ventana = arr => n >= 11 ? arr.slice(n-11, n-4) : n >= 3 ? arr.slice(0, n-1) : [];
    const ayer = n ? L[n-1] : null, base = avg(ventana(L));
    const rAyer = n ? R[n-1] : null, rBase = avg(ventana(R));
    a.ayer = ayer; a.base = base;
    a.dif = (ayer != null && base) ? (ayer - base) / base : null;
    a.rdif = (rAyer != null && rBase) ? (rAyer - rBase) / rBase : null;
    if (a.dif != null && a.dif <= -U.caida_pct/100){
      const conR = a.rdif != null && a.rdif <= -U.rumia_baja_pct/100;
      al.push({sev: (a.dif <= -0.25 || conR) ? "alta" : "media", tipo:"Bajó la leche",
        txt:`${n1(ayer)} L ayer contra ${n1(base)} L de su normal (${Math.round(a.dif*100)} %)` + (conR ? `; rumia ${Math.round(a.rdif*100)} %` : ""),
        rec: conR ? "Revisarla hoy: temperatura, ubre, cascos y si está comiendo." : "Vigilar en el próximo ordeño."});
    } else if (a.rdif != null && a.rdif <= -U.rumia_baja_pct/100){
      al.push({sev:"media", tipo:"Rumia baja", txt:`Rumió ${Math.round(a.rdif*-100)} % menos que su normal`, rec:"Revisar consumo de alimento."});
    }
    a.fert = a.celo ? calcFert(a) : null;
    if (a.fert) al.push({sev: a.fert.estado.sev, tipo: a.fert.estado.clave === "aborto" ? "Sospecha de aborto" : a.fert.falso ? "Posible celo falso" : "Celo", txt: a.fert.estado.corto + (a.fert.falso ? "" : ` · concepción ${a.fert.prob.toLowerCase()}`), rec: a.fert.estado.txt});
    else if (a.actividad_alta) al.push({sev:"alta", tipo:"Posible celo", txt:`Actividad alta${a.del_!=null?`; ${a.del_} días en leche`:""}${a.servicios!=null?`, ${a.servicios} servicio(s)`:""}`, rec:"Confirmar celo e inseminar según la regla mañana–tarde."});
    if (a.tratamiento && a.tratamiento.retiro_dias > 0){
      const libre = parseDM(a.tratamiento.libre);
      if (libre >= HOY) al.push({sev:"alta", tipo:"Leche en retiro", txt:`${a.tratamiento.motivo}; desde ${a.tratamiento.inicio}`, rec:`No mandar su leche al tanque hasta el ${a.tratamiento.libre}.`});
    } else if (a.tratamiento){
      al.push({sev:"info", tipo:"En tratamiento", txt:`${a.tratamiento.motivo}${a.tratamiento.inicio?`; desde ${a.tratamiento.inicio}`:""}`, rec:"Seguir el plan del veterinario y confirmar si hay retiro de leche."});
    }
    if (a.estado === "Preñada" && a.dias_prenez >= U.secado_dias + 7) al.push({sev:"alta", tipo:"Toca secar", txt:`${a.dias_prenez} días de preñez: secado atrasado ${a.dias_prenez - U.secado_dias} días`, rec:"Secar hoy y pasar al grupo de secas."});
    else if (a.estado === "Preñada" && a.dias_prenez >= U.secado_dias) al.push({sev:"media", tipo:"Toca secar", txt:`${a.dias_prenez} días de preñez`, rec:"Secar esta semana y pasar al grupo de secas."});
    if (a.estado !== "Preñada" && a.servicios >= U.repetidora_serv) al.push({sev:"media", tipo:"Repetidora", txt:`${a.servicios} servicios sin preñez${a.del_!=null?`; ${a.del_} días en leche`:""}`, rec:"Revisión reproductiva con el veterinario."});
    if (a.estado === "Inseminada" && a.ultima_ia){ const d = a._iaF ? Math.round((HOY - a._iaF)/864e5) : daysSince(a.ultima_ia); a.dias_ia = d;
      if (d >= 60) al.push({sev:"media", tipo:"IA sin diagnóstico", txt:`Inseminada hace ${d} días (${a.ultima_ia}) y sin chequeo de preñez`, rec:"Palpar o hacer ultrasonido ya: pudo repetir celo sin que se viera."});
      else if (d >= U.diag_prenez_dias) al.push({sev:"info", tipo:"Diagnóstico de preñez", txt:`Inseminada hace ${d} días (${a.ultima_ia})`, rec:"Incluir en la próxima palpación o ultrasonido."});
      else if (d >= 18 && d <= 24 && !a.actividad_alta) al.push({sev:"info", tipo:"Vigilar retorno a celo", txt:`Día ${d} después de la inseminación`, rec:"Si vuelve a mostrar celo, no preñó: inseminar de nuevo."}); }
    if (a.estado === "Abierta" && !a.servicios && a.del_ != null && a.del_ >= 80 && !a.actividad_alta) al.push({sev:"media", tipo:"Sin servicio", txt:`${a.del_} días en leche y nunca inseminada en esta lactancia`, rec:"Revisar si ha mostrado celo; si no, revisión reproductiva (meta: primer servicio antes de 80 días)."});
    if (a.cc != null && a.cc <= 2.5 && a.del_ != null && a.del_ < 60) al.push({sev:"media", tipo:"Condición corporal baja", txt:`CC ${String(a.cc).replace(".",",")} con ${a.del_} días en leche`, rec:"Revisar dieta del grupo de inicio de lactancia."});
    if (a.temp_corp != null && a.temp_corp >= 39.5) al.push({sev: a.temp_corp >= 40 ? "alta" : "media", tipo:"Temperatura alta", txt:`${String(a.temp_corp).replace(".",",")} °C`, rec:"Revisar a la vaca: posible fiebre (mastitis, metritis, neumonía) o estrés calórico."});
    if (a.prep_s > U.prep_meta_s) al.push({sev:"info", tipo:"Preparación lenta", txt:`${a.prep_s} s hasta el pico de flujo (meta ≤ ${U.prep_meta_s} s)`, rec:"Revisar rutina de despunte y estimulación."});
  }
  if ((a.grupo === "Secas" || a.grupo === "Novillas") && a.estado === "Preñada" && a.dias_prenez != null){
    a.parto = addDays(HOY, U.parto_dias - a.dias_prenez);
    const falta = U.parto_dias - a.dias_prenez;
    if (a.grupo === "Secas" && falta <= 14) al.push({sev: falta <= 5 ? "alta" : "media", tipo:"Parto próximo", txt:`Parto estimado ${dm(a.parto)} (${falta} días)`, rec:"Pasar a preparto y vigilar."});
  }
  if (a.grupo === "Terneras" && a.peso && a.meta){
    a.ratio = a.peso / a.meta;
    if (a.ratio < 0.9) al.push({sev: a.ratio < 0.85 ? "alta" : "media", tipo:"Crecimiento bajo", txt:`${a.peso} kg contra meta de ${a.meta} kg a los ${a.edad_dias} días`, rec:"Revisar consumo de leche y concentrado, y salud respiratoria."});
  }
  if (a.grupo === "Terneras"){
    const enf = (a.salud || []).filter(s => Math.round((HOY - s.f)/864e5) <= 14);
    if (enf.length){ const u = enf[enf.length-1], du = Math.round((HOY - u.f)/864e5);
      al.push({sev: du <= 3 || enf.length > 1 ? "alta" : "media", tipo:"Ternera enferma", txt:`${u.problema} · ${dm(u.f)}${enf.length > 1 ? ` · ${enf.length} episodios en 2 semanas` : ""}`, rec:"Revisar hidratación, temperatura y que esté tomando; seguir el plan del veterinario."}); }
    if (a.calostro != null && a.calostro < 4 && a.edad_dias != null && a.edad_dias <= 15) al.push({sev:"media", tipo:"Calostro bajo", txt:`Tomó ${n1(a.calostro)} L de calostro (meta 4 L en 2 horas)`, rec:"Vigilarla de cerca: más riesgo de diarrea y neumonía las primeras semanas."});
    if (a.gdp != null && a.gdp < 0.5) al.push({sev:"media", tipo:"Gana poco peso", txt:`${n1(a.gdp)} kg por día entre los dos últimos pesajes (meta 0,7)`, rec:"Revisar litros de leche, concentrado de inicio y agua."});
    if (a.ultPeso && Math.round((HOY - a.ultPeso)/864e5) > 45) al.push({sev:"info", tipo:"Pesaje atrasado", txt:`Último pesaje hace ${Math.round((HOY - a.ultPeso)/864e5)} días`, rec:"Pesar o medir con cinta este mes."});
  }
  if (a.grupo === "Novillas" && a.edad_meses >= 15 && !["Preñada","Inseminada"].includes(a.estado)) al.push({sev:"media", tipo:"Novilla sin servicio", txt:`${a.edad_meses} meses y sin preñez`, rec:"Inseminar a los 13–15 meses con el 55 % del peso adulto, para que para a los 24–26 meses."});
  al.sort((x,y) => SEV[y.sev] - SEV[x.sev]);
  a.alertas = al;
  a.score = al.reduce((s,x) => s + (x.sev==="alta"?10:x.sev==="media"?4:1), 0);
  a.sev = al.length ? al[0].sev : null;
  return a;
}

function cargar(data, recarga){
  if (!recarga) BASE = structuredClone(data);
  D = data; U = D.umbrales;
  { const [d,m,y] = D.hoy.split("/").map(Number); HOY = new Date(y, m-1, d); }
  FECHAS_D = D.fechasISO ? D.fechasISO.map(s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); })
                         : D.fechas.map(s => parseDM(s));
  AHORA = D.ahora ? new Date(D.ahora) : (() => { const [hh,mm] = (D.hora_reporte || "06:00").split(":").map(Number); const x = new Date(HOY); x.setHours(hh, mm, 0, 0); return x; })();
  CLIMA = prepararClima(D.clima, D.climaFuente || (D.fuente === "import" ? "vivo" : "demo"));
  ANIM = D.animales; ANIM.forEach(a => a.num = String(a.num));
  aplicarRegistros();
  ORD = ANIM.filter(a => a.grupo === "Ordeño");
  ANIM.forEach(analizar);
  CON_ALERTA = ANIM.filter(a => a.alertas.length).sort((x,y)=>y.score-x.score);
  PRIOR = CON_ALERTA.filter(a => a.alertas.some(x => x.sev !== "info"));
  ALTAS = CON_ALERTA.filter(a => a.sev === "alta");
  NF = D.fechas.length;
  const sumDia = (k, i) => { let s = 0, hay = false; ORD.forEach(a => { const v = a[k] && a[k][i]; if (v != null){ s += v; hay = true; } }); return hay ? s : null; };
  TOT = D.fechas.map((_,i)=>sumDia("leche", i));
  TOT_MD = D.fechas.map((_,i)=>sumDia("md", i));
  TOT_NO = D.fechas.map((_,i)=>sumDia("no", i));
  ayerTot = NF ? TOT[NF-1] : null;
  semana = NF >= 2 ? avg(TOT.slice(Math.max(0,NF-8), NF-1)) : null;
  enLeche = NF ? ORD.filter(a => a.leche && a.leche[NF-1] != null).length : 0;
  D.tablas = (D.tablasCrudas || []).concat(tablasDerivadas());
  EX.t = 0; EX.m = null; EX.preset = null; PRESET_CACHE = null;
}

/* ================= Gráficos interactivos ================= */
const CH = {}; let chN = 0;
const PAL = ["var(--accent)","var(--straw)","var(--info)","var(--c4)","var(--c5)","var(--c6)","var(--brand-red)"];
function niceStep(r){ const p = Math.pow(10, Math.floor(Math.log10(r||1))); const m = r/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
function chart(spec){
  const id = "c" + (++chN); CH[id] = spec;
  spec.series.forEach(s => { if (s.on === undefined) s.on = true; });
  const leg = spec.series.length > 1 ? `<div class="legend">${spec.series.map((s,i)=>`<button class="lg" data-serie="${id}:${i}" aria-pressed="${s.on}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`).join("")}</div>` : "";
  return `<div class="chartbox" data-chart="${id}"><div class="svgw">${dibujar(spec)}</div><div class="tip" hidden></div>${leg}</div>`;
}
function dibujar(spec){
  const W = Math.round(Math.min(560, Math.max(300, (window.innerWidth || 560) - 64))), H = Math.round((spec.h || 210) * Math.max(0.8, W/560)), P = {l:44, r:12, t:14, b:28};
  const vis = spec.series.filter(s => s.on);
  const n = spec.labels.length;
  const vals = vis.flatMap(s => s.data).filter(v => v != null && !isNaN(v));
  if ((!vals.length && !spec.fixed) || !n){ spec._geo = null; return `<svg class="chart" viewBox="0 0 ${W} 60"><text x="${W/2}" y="34" text-anchor="middle">Sin datos para mostrar</text></svg>`; }
  const bar = spec.type === "bar";
  let mx = vals.length ? Math.max(...vals) : 1, mn = vals.length ? ((bar || spec.zero) ? Math.min(0, ...vals) : Math.min(...vals)) : 0;
  if (mx === mn){ mx = mx + Math.max(1, Math.abs(mx)*0.1); if (!bar) mn = mn - Math.max(1, Math.abs(mn)*0.1); }
  let step = niceStep((mx-mn)/4); mn = Math.floor(mn/step)*step; mx = Math.ceil(mx/step)*step;
  if (spec.fixed){ mn = spec.fixed[0]; mx = spec.fixed[1]; step = spec.fixed[2] || niceStep((mx-mn)/5); }
  const iw = W-P.l-P.r, ih = H-P.t-P.b, band = iw / n;
  const X = i => bar ? P.l + band*i + band/2 : P.l + (n === 1 ? iw/2 : i*iw/(n-1));
  const Y = v => P.t + (1-(v-mn)/(mx-mn))*ih;
  let g = "";
  if (spec.band) g += `<rect x="${X(spec.band[0])}" y="${P.t}" width="${Math.max(0,X(spec.band[1])-X(spec.band[0]))}" height="${ih}" fill="var(--straw)" fill-opacity=".12"/>`;
  const geo0 = {W, H, P, n, X, Y, band, bar, iw, ih, mn, mx};
  if (spec.fondo) g += spec.fondo(geo0);
  for (let v = mn; v <= mx + 1e-9; v += step) g += `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${nA(v)}</text>`;
  if (spec.under) g += spec.under(geo0);
  const cada = spec.cada || Math.max(1, Math.ceil(n / (bar ? Math.max(4, Math.floor(W/62)) : Math.max(3, Math.floor(W/95)))));
  for (let i = 0; i < n; i++){
    if (spec.cada){ if (i % spec.cada) continue; }
    else { if (i % cada && i !== n-1) continue; if (!bar && i !== n-1 && n-1-i < cada) continue; }
    let t = String(spec.labels[i]); if (bar && t.length > 9) t = t.slice(0,8) + "…";
    const anc = bar || spec.cada ? "middle" : i === 0 ? "start" : i === n-1 ? "end" : "middle";
    g += `<text x="${X(i)}" y="${H-8}" text-anchor="${anc}">${esc(t)}</text>`;
  }
  g += `<rect class="hl" x="0" y="${P.t}" width="${band}" height="${ih}" fill="var(--ink)" fill-opacity=".06" visibility="hidden"/>`;
  if (bar){
    const gw = band*0.74, bw = gw / vis.length;
    vis.forEach((s, k) => s.data.forEach((v, i) => { if (v == null || isNaN(v)) return;
      const x = X(i) - gw/2 + k*bw, y0 = Y(0), y = Y(v);
      g += `<rect x="${x.toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${Math.max(1,bw-1.5).toFixed(1)}" height="${Math.abs(y0-y).toFixed(1)}" rx="3" fill="${s.color}"/>`; }));
  } else {
    vis.forEach(s => {
      let d = "", pen = false, first = null, last = null;
      s.data.forEach((v, i) => { if (v == null || isNaN(v)){ pen = false; return; } const p = [X(i), Y(v)]; d += (pen ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); pen = true; if (!first) first = p; last = p; });
      if (!d) return;
      if (s.fill && first) g += `<path d="${d}L${last[0]},${Y(Math.max(mn,0))}L${first[0]},${Y(Math.max(mn,0))}Z" fill="${s.color}" fill-opacity=".13"/>`;
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (last) g += `<circle cx="${last[0]}" cy="${last[1]}" r="3.6" fill="${s.color}"/>`;
    });
    g += `<line class="guide" x1="0" x2="0" y1="${P.t}" y2="${P.t+ih}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><g class="dots"></g>`;
  }
  if (spec.over) g += spec.over(geo0);
  spec._geo = {W, H, P, n, X, Y, band, bar, iw};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria||"Gráfico")}">${g}</svg>`;
}
function onPtr(e){
  const box = e.target.closest ? e.target.closest(".chartbox") : null;
  document.querySelectorAll(".chartbox[data-act]").forEach(b => { if (b !== box) ocultarTip(b); });
  if (!box) return;
  const svg = box.querySelector("svg.chart"); if (!svg || !svg.contains(e.target)) { ocultarTip(box); return; }
  const spec = CH[box.dataset.chart], g = spec && spec._geo; if (!g) return;
  const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * g.W;
  let i = g.bar ? Math.floor((x - g.P.l) / g.band) : Math.round((x - g.P.l) / (g.n === 1 ? 1 : g.iw/(g.n-1)));
  i = Math.max(0, Math.min(g.n-1, i));
  const vis = spec.series.filter(s => s.on);
  const hl = svg.querySelector(".hl"), guide = svg.querySelector(".guide"), dots = svg.querySelector(".dots");
  if (g.bar){ hl.setAttribute("x", g.X(i) - g.band/2); hl.setAttribute("visibility","visible"); }
  else { guide.setAttribute("x1", g.X(i)); guide.setAttribute("x2", g.X(i)); guide.setAttribute("visibility","visible");
    dots.innerHTML = vis.map(s => s.data[i] == null || isNaN(s.data[i]) ? "" : `<circle cx="${g.X(i)}" cy="${g.Y(s.data[i])}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join(""); }
  const tip = box.querySelector(".tip");
  const u = spec.unit ? " " + spec.unit : "";
  tip.innerHTML = `<b>${esc(spec.full ? spec.full[i] : spec.labels[i])}</b>` + vis.map(s => `<div><i style="background:${s.color}"></i>${esc(s.name)}: <strong>${s.data[i]==null||isNaN(s.data[i])?"—":nA(s.data[i])+u}</strong></div>`).join("") + (spec.extra ? spec.extra(i) : "");
  tip.hidden = false; box.dataset.act = "1";
  const bw = box.clientWidth, px = g.X(i) / g.W * r.width + (r.left - box.getBoundingClientRect().left), tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(bw - tw, px > bw/2 ? px - tw - 12 : px + 12)) + "px";
}
function ocultarTip(box){ delete box.dataset.act; const t = box.querySelector(".tip"); if (t) t.hidden = true;
  box.querySelectorAll(".guide,.hl").forEach(el => el.setAttribute("visibility","hidden")); const d = box.querySelector(".dots"); if (d) d.innerHTML = ""; }
document.addEventListener("pointermove", onPtr);
document.addEventListener("pointerdown", onPtr);
function toggleSerie(ref){
  const [id, k] = ref.split(":"); const spec = CH[id]; if (!spec) return;
  const s = spec.series[+k]; if (s.on && spec.series.filter(x=>x.on).length === 1) return toast("Debe quedar al menos una serie visible.");
  s.on = !s.on; const box = document.querySelector(`.chartbox[data-chart="${id}"]`);
  box.querySelector(".svgw").innerHTML = dibujar(spec);
  box.querySelector(`[data-serie="${ref}"]`).setAttribute("aria-pressed", s.on);
  if (spec.onToggle) spec.onToggle(+k, s.on);
}

/* ================= Ventana de fertilidad con las medidas de SCR (collares de actividad y rumia) =================
   Fuente: presentación "La Reproducción y la Detección de Celos" (SCR by Allflex).
   - El reloj se cuenta desde el PICO de actividad.
   - Tiempo para la IA: 0 a 26 h después del pico. Tiempo óptimo: 3 a 18 h. Ovulación: 28 a 30 h.
   - "Horas para la inseminación" = horas que quedan de las 26: ≥24 temprano, 10–23 óptimo, 0–9 últimas horas, ≤ -1 cerrada.
   - Alta actividad: cambio de actividad ≥ 30. En el celo la rumia baja.
   - Índice de celo (0 a 100): pico de actividad, caída de rumia, duración del celo y días desde el último celo. Verde desde 32. */
const HORA = 3600e3;
let AHORA = null;
const SCR = {alta:30, total:26, optIni:3, optFin:18, maxIni:8, maxFin:16, ovuIni:28, ovuFin:30, indiceVerde:32};
// Tasa de concepción según horas desde el pico (promedio de las 4 granjas de la presentación de SCR)
const CONCEP = [[-12,12],[-4,22],[4,43],[12,44],[20,38],[30,32],[42,20]];
function concepcionEn(hDesdePico){
  if (hDesdePico <= CONCEP[0][0]) return CONCEP[0][1];

const ORDEN_FERT = {optimo:0, bueno:1, ultimas:2, aborto:3, temprano:4, espera:5, falso:6, cerrada:7};

function graficoFert(a, alto){
  const F = a.fert; if (!F) return "";
  const ini = new Date(+F.pico - 30*HORA);

  const n = Math.round((fin - ini)/HORA) + 1;
  const tiempos = Array.from({length:n}, (_, i) => new Date(+ini + i*HORA));
  const val = arr => tiempos.map(t => { if (!F.serie || !arr) return null; const k = Math.round((t - F.t0)/HORA); return k >= 0 && k < arr.length && t <= AHORA ? arr[k] : null; });

    fondo: geo => `<rect x="${geo.P.l}" y="${geo.Y(110)}" width="${geo.iw}" height="${geo.Y(SCR.alta)-geo.Y(110)}" fill="var(--straw)" fill-opacity=".13"/>` +

      `<rect x="${geo.P.l}" y="${geo.P.t}" width="${Math.max(0, Math.min(xT(geo, AHORA), geo.W-geo.P.r) - geo.P.l)}" height="${geo.ih}" fill="var(--ink)" fill-opacity=".06"/>`,
    under: geo => {

        `<text x="${xc}" y="${Math.max(geo.P.t + 62, cy - r2 - 6)}" text-anchor="middle" style="fill:var(--fert-ink);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round">Momento óptimo ${hm(F.centro)}</text>` +
        `<line x1="${xv}" x2="${xv}" y1="${cy - 46}" y2="${cy}" stroke="var(--fert-ink)" stroke-dasharray="3 3"/><circle cx="${xv}" cy="${cy - 50}" r="4" fill="none" stroke="var(--fert-ink)" stroke-width="1.5"/>` +

const LEYENDA_FERT = `<div class="fert-leyenda"><span><i style="background:var(--fert)"></i>Línea con la vaca: dónde está ahora</span><span><i class="semi"></i>Burbuja: área para inseminar; el centro es el momento óptimo</span><span><img src="${ICONO_CELO}" alt="" class="ico-celo">Celo: pico de actividad</span><span><i style="background:var(--straw);opacity:.4"></i>Zona de alta actividad</span></div>`;

function tipoCol(t, j){

  let tipo;
  if (rol && rol[0] === "fecha") tipo = "fecha";
  else if (rol && rol[0] === "num") tipo = "id";

    let nn = 0, nd = 0, tot = 0; const vistos = new Set();

      const ex = {m: p.m === "#conteo" ? "#conteo" : r[p.m], m2: p.m2 ? r[p.m2] : null, por: r[p.por], sep: p.sep ? r[p.sep] : "", calc: p.calc};

function opcionesExplorador(t){

    if (tp === "fecha" || tp === "id") por.push(c);
    else if ((tp === "texto" || tp === "num") && card(t,j) <= 60 && card(t,j) >= 1) por.push(c);
    if ((tp === "texto" || (tp === "num" && card(t,j) <= 8)) && card(t,j) <= 12 && card(t,j) >= 2) sep.push(c); });

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function textoParaVoz(txt){
  return txt.replace(/•/g, "")
    .replace(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/g, (m, d, mo) => +mo >= 1 && +mo <= 12 ? `${+d} de ${MESES[+mo-1]}` : m)
    .replace(/\bLact\.\s*/g, "lactancia ").replace(/\blact\.\s*/g, "lactancia ")
    .replace(/\bDEL\b/g, "días en leche").replace(/\bCC\b/g, "condición corporal").replace(/\bIA\b/g, "inseminación")
    .replace(/(\d) (L|kg|s|min|d)(?![\wáéíóúñ])/g, (m, n, u) => n + " " + ({L:"litros", kg:"kilos", s:"segundos", min:"minutos", d:"días"})[u])
    .replace(/-(\d+) %/g, "menos $1 por ciento").replace(/ ?%/g, " por ciento")
    .replace(/≤/g, "menor o igual a").replace(/×/g, " cruce ").replace(/ — /g, ", ").replace(/ · /g, ". ")
    .replace(/\s*\(/g, ", ").replace(/\)/g, "").replace(/\s*,\s*([;.:])/g, "$1").replace(/\s+,/g, ",");
}
function trozos(txt){
  if (LANG !== "es") return tr(txt).replace(/•/g, "").replace(/ · /g, ". ").split(/\n+/).flatMap(l => l.split(/(?<=[.;:!?。！？।])\s*/)).map(s => s.trim()).filter(s => s.length > 1);
  return textoParaVoz(txt).split(/\n+/).flatMap(l => l.split(/(?<=[.;:!?])\s+/)).map(s => s.replace(/^[\s,]+|[\s,]+$/g, "")).filter(s => /[a-z0-9áéíóúñ]/i.test(s));
}
function vocesES(){ try { const re = new RegExp("^" + LANG + "(\\b|[-_])", "i"); return speechSynthesis.getVoices().filter(v => re.test(v.lang)); } catch(e){ return []; } }
function puntajeVoz(v){
  let s = 0; const n = v.name, l = v.lang.replace("_","-");
  if (/es-CR/i.test(l)) s += 50; else if (/es-(419|MX|US|CO|PA|GT|HN|NI|SV|PE|CL|AR|UY|VE|EC|BO|PY|DO|PR|CU)/i.test(l)) s += 25; else if (/es-ES/i.test(l)) s += 8;
  if (/natural|neural|online|enhanced|premium|mejorad/i.test(n)) s += 45; if (/google/i.test(n)) s += 22; if (/siri|paulina|m[oó]nica|juan|diego|sabina|marisol/i.test(n)) s += 10;
  return s;
}
function mejorVoz(){
  const vs = vocesES(); if (!vs.length) return null;
  const elegida = store.get("voz", ""); const v = vs.find(x => x.name === elegida);

let hablandoBtn = null, colaVoz = [], vozId = 0;
const TTS = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech;
function detenerVoz(){ vozId++; colaVoz = []; try { if (TTS()) TTS().stop(); else speechSynthesis.cancel(); } catch(e){} if (hablandoBtn){ hablandoBtn.textContent = "▶ Escuchar"; hablandoBtn = null; } }
function hablar(txt, btn){
  if (TTS()){
    if (btn && btn === hablandoBtn){ detenerVoz(); return; }
    detenerVoz(); const id = vozId, tts = TTS(), vel = store.get("vozVel", 0.95); colaVoz = trozos(txt);
    if (btn){ hablandoBtn = btn; btn.textContent = "■ Detener"; }
    const sig = async () => { if (id !== vozId) return; const frase = colaVoz.shift();
      if (frase == null){ if (btn && hablandoBtn === btn){ btn.textContent = "▶ Escuchar"; hablandoBtn = null; } return; }
      try { await tts.speak({text: frase, lang: LANG === "es" ? "es-US" : (IDIOMAS.find(x => x.k === LANG) || {}).tts, rate: vel, pitch: 1.0, volume: 1.0, category: "playback"}); } catch(e){}
      if (id === vozId) setTimeout(sig, /[,;]$/.test(frase) ? 150 : 320); };
    sig(); return;
  }
  let s; try { s = window.speechSynthesis; if (!s) throw 0; } catch(e){ return toast("Este navegador no tiene voz disponible."); }
  if (btn && btn === hablandoBtn){ detenerVoz(); return; }
  detenerVoz();
  const id = vozId, voz = mejorVoz(), vel = store.get("vozVel", 0.95);
  colaVoz = trozos(txt);
  if (btn){ hablandoBtn = btn; btn.textContent = "■ Detener"; }
  const siguiente = () => {
    if (id !== vozId) return;
    const frase = colaVoz.shift();
    if (frase == null){ if (hablandoBtn === btn && btn){ btn.textContent = "▶ Escuchar"; hablandoBtn = null; } return; }
    const u = new SpeechSynthesisUtterance(frase);
    if (voz){ u.voice = voz; u.lang = voz.lang; } else u.lang = (IDIOMAS.find(x => x.k === LANG) || {tts:"es-CR"}).tts;
    u.rate = vel; u.pitch = 1;
    const pausa = /[.:!?]$/.test(frase) || !/[,;]$/.test(frase) ? 420 : 220;
    u.onend = () => setTimeout(siguiente, pausa); u.onerror = () => setTimeout(siguiente, 50);
    s.speak(u);
  };

}

    });
  }));

    a.lact = nu("lact"); a.del_ = nu("del") != null ? Math.round(nu("del")) : null; a.estado = normEstado(s.estado);

    a.dias_prenez = nu("dias_prenez"); a.servicios = nu("servicios"); a.cc = nu("cc"); a.peso = nu("peso") != null ? Math.round(nu("peso")) : null;
    a.raza = s.raza ? String(s.raza) : null; a.toro = s.toro ? String(s.toro) : null;
    if (a.dias_prenez != null && !a.estado) a.estado = "Preñada";
    const fia = parseFecha(s.ultima_ia); a.ultima_ia = fia ? dm(fia) : null;

    if (s.tratamiento) a.tratamiento = {motivo:String(s.tratamiento), inicio:R.snapF.tratamiento ? dm(new Date(R.snapF.tratamiento)) : null, retiro_dias:0};
    const pr = nu("prep"); if (pr != null) a.prep_s = Math.round(pr);
    if (nu("temp_corp") != null) a.temp_corp = nu("temp_corp");
    if (s.inicio_celo != null || s.ventana != null || nu("horas_ia") != null){
      const c = {}; const ic = s.inicio_celo;
      const rel = String(ic ?? "").match(/(\d+)\s*d\D*(\d+)\s*h/i) || String(ic ?? "").match(/^(\d+)\s*h/i);
      const fh = parseFechaHora(ic);
      if (fh) c.inicio = fh;

      else if (typeof ic === "number" && ic >= 0 && ic < 200) c.inicio_h = ic;
      if (s.ventana != null) c.ventana = String(s.ventana);
      if (s.concepcion != null && !/^-+$/.test(String(s.concepcion).trim())) c.concepcion = String(s.concepcion);
      if (nu("indicador1") != null) c.max1 = Math.round(nu("indicador1")); if (nu("indicador2") != null) c.max2 = Math.round(nu("indicador2"));

      if (nu("horas_ia") != null) c.horas_ia = nu("horas_ia");
      if (nu("pico_actividad") != null) c.max1 = Math.round(nu("pico_actividad")); if (nu("pico_rumia") != null) c.rumia_pico = Math.round(nu("pico_rumia"));

    if (edadD != null){ a.edad_dias = edadD; a.edad_meses = Math.round(edadD/30.4); }
    if (a.grupo === "Sin grupo" && edadD != null) a.grupo = edadD < 365 ? "Terneras" : "Novillas";

    }
    animales.push(a);

  if (!animales.length && !tablasCrudas.length) return;

function importarTablas(lista){
  IMP.archivos = IMP.archivos.filter(a => !a.captura);
  lista.forEach((c, i) => { const t = prepararTabla(c.filas, c.hoja || "Página"); if (!t.data.length) return;
    const f = new Date(c.fecha || Date.now());
    IMP.archivos.push({nombre: c.nombre || ("Captura " + (i+1)), firma: "captura|" + i + "|" + (c.fecha||""), modificado: +f, fecha: f, fechaDe: "archivo", captura: true, origen: c.url || "", tablas: [t]}); });
  if (IMP.archivos.length) construir(); render();
}
function leerCapturasExtension(){
  try { if (!(window.chrome && chrome.storage && chrome.storage.local)) return;
    chrome.storage.local.get(["capturas"], r => { const l = (r && r.capturas) || []; if (l.length){ importarTablas(l); toast(`Listo: ${l.length} tabla${l.length>1?"s":""} de la web.`); } });
    chrome.storage.onChanged && chrome.storage.onChanged.addListener((ch, area) => { if (area === "local" && ch.capturas) importarTablas(ch.capturas.newValue || []); });
  } catch(e){}
}

const MOVIL = !!window.Capacitor;
const ESCRITORIO = {activo:false, carpeta:"", ultima:0, max:120};
async function iniciarEscritorio(){
  if (location.hostname !== "127.0.0.1") return;
  try {
    const r = await fetch("/api/config"); if (!r.ok) return; const c = await r.json();
    ESCRITORIO.activo = true; ESCRITORIO.carpeta = c.carpeta || ""; ESCRITORIO.max = c.max || 120;
    setInterval(() => fetch("/api/ping").catch(() => {}), 8000); fetch("/api/ping").catch(() => {});
    window.addEventListener("focus", () => { if (ESCRITORIO.carpeta && Date.now() - ESCRITORIO.ultima > 120000) leerCarpetaLocal(true); });
    if (ESCRITORIO.carpeta) await leerCarpetaLocal(true); else render();
  } catch(e){}
}
async function elegirCarpeta(){
  toast("Se abrió la ventana para elegir la carpeta.");
  try { const r = await fetch("/api/elegir", {method:"POST"}); const j = await r.json();

  } catch(e){ toast("No se pudo abrir la ventana de carpetas."); }

async function leerCarpetaLocal(silencio){
  try {
    const j = await (await fetch("/api/archivos")).json();
    ESCRITORIO.ultima = Date.now();
    if (j.error){ IMP.errores = [j.error]; return render(); }
    const files = j.archivos.map(a => ({name:a.nombre, size:a.tamano, lastModified:a.modificado,
      arrayBuffer: () => fetch("/api/leer?ruta=" + encodeURIComponent(a.ruta)).then(r => r.arrayBuffer()),
      hojas: /\.(xlsx|xlsm)$/i.test(a.nombre) ? () => fetch("/api/hojas?ruta=" + encodeURIComponent(a.ruta)).then(r => r.json()).then(hs => {
        if (hs.error) throw new Error(hs.error);
        return hs.map(s => ({nombre: s.nombre, filas: s.filas.map(f => f.map(c => c && typeof c === "object" && c.d ? (([y,m,d]) => new Date(+y, m-1, +d))(c.d.split("-")) : c))})); }) : null}));
    const firmas = new Set(files.map(f => f.name + "|" + f.size + "|" + f.lastModified));
    const antes = IMP.archivos.length;
    IMP.archivos = IMP.archivos.filter(a => firmas.has(a.firma));
    if (!files.length){ IMP.archivos = []; IMP.errores = ["La carpeta no tiene reportes de Excel o CSV todavía."]; cargar(structuredClone(DEMO)); return render(); }
    const nuevos = files.filter(f => !IMP.archivos.some(a => a.firma === f.name + "|" + f.size + "|" + f.lastModified));
    if (nuevos.length) await leerArchivos(nuevos, silencio);
    else { if (IMP.archivos.length !== antes) construir(); if (!silencio) toast("La carpeta no tiene reportes nuevos."); render(); }
  } catch(e){ toast("No se pudo leer la carpeta."); }
}

      case "celo": a.celo_visto = f; if (diasDesde(f) <= 1 && !a.celo) a.actividad_alta = true; break;
      case "ia": a.servicios = (a.servicios || 0) + 1; a._iaF = f; a.ultima_ia = dm(f); a.estado = "Inseminada"; a.dias_prenez = null; if (v("toro")) a.toro = v("toro"); break;
      case "diagnostico":

        else { a.estado = "Preñada"; a._prenezBase = a._iaF || parseDM(a.ultima_ia) || addDays(f, -U.diag_prenez_dias); } break;

        break; }

      case "pesaje": a.pesajes = (a.pesajes || []).concat({f, peso: nv("peso")}); a.peso = nv("peso"); break;
      case "vacuna": VACUNAS.push({f, num: v("num"), producto: v("producto") || "Vacuna", repetir: nv("repetir")}); break;
      case "salida": if (a){ SALIDAS.push({f, num:a.num, motivo: v("motivo") || "Muerte", causa: v("causa"), grupo: a.grupo, edad: a.nacimiento ? Math.round((f - a.nacimiento)/864e5) : (a.edad_dias != null ? a.edad_dias - diasDesde(f) : null)}); a._fuera = true; } break;
      case "tanque": if (nv("litros") != null) TANQUE.push({f, litros: nv("litros")}); break;
      case "nota": break;
    }
  });
  ANIM.forEach(a => {
    if (a._partoF) a.del_ = diasDesde(a._partoF);
    if (a.estado === "Preñada" && a._prenezBase) a.dias_prenez = diasDesde(a._prenezBase);

const mesClave = f => MESES[f.getMonth()].slice(0,3) + " " + String(f.getFullYear()).slice(2);
function crianzaMeses(){
  let M = D.crianza_meses ? D.crianza_meses.map(r => ({...r})) : null;
  const muertesT = SALIDAS.filter(s => s.motivo === "Muerte" && (s.grupo === "Terneras" || (s.edad != null && s.edad < 365)));
  if (!M && !NACS.length && !muertesT.length) return null;
  if (!M){ M = []; for (let k = 11; k >= 0; k--){ const f = new Date(HOY.getFullYear(), HOY.getMonth() - k, 1); M.push({mes: mesClave(f), nacimientos:0, muertes:0}); } }
  const idx = new Map(M.map((r,i) => [r.mes, i]));
  NACS.forEach(n => { const i = idx.get(mesClave(n.f)); if (i != null) M[i].nacimientos++; });
  muertesT.forEach(n => { const i = idx.get(mesClave(n.f)); if (i != null) M[i].muertes++; });
  return M;
}
function mortalidad12(){ const M = crianzaMeses(); if (!M) return null; const n = M.reduce((s,r) => s + r.nacimientos, 0); return n ? M.reduce((s,r) => s + r.muertes, 0)/n : null; }

/* ================= Agenda de las próximas semanas ================= */
function agenda(dias){
  const ev = [], fin = addDays(HOY, dias);
  const add = (f, t, a, extra) => { const atras = f < HOY; ev.push({f: atras ? HOY : f, t, num: a ? a.num : extra && extra.num || "Hato", a, atras, ...extra}); };
  ANIM.forEach(a => {
    const iaF = a._iaF || (a.ultima_ia ? parseDM(a.ultima_ia) : null);
    if (a.estado === "Inseminada" && iaF){ add(addDays(iaF, U.diag_prenez_dias), "Chequeo de preñez", a); const r = addDays(iaF, 21); if (r >= HOY) add(r, "Vigilar retorno a celo", a); }
    if (a.estado === "Preñada" && a.dias_prenez != null){
      if (a.grupo === "Ordeño") add(addDays(HOY, U.secado_dias - a.dias_prenez), "Secar", a);
      add(addDays(HOY, U.parto_dias - a.dias_prenez), "Parto estimado", a);
    }
    if (a.grupo === "Terneras" && a.edad_dias != null && a.edad_dias < 60) add(addDays(HOY, 60 - a.edad_dias), "Destete (60 días)", a);
  });
  const ult = new Map(); VACUNAS.forEach(v => { const k = (v.num || "Hato") + "|" + v.producto.toLowerCase(); if (!ult.has(k) || ult.get(k).f < v.f) ult.set(k, v); });
  ult.forEach(v => { if (v.repetir) add(addMeses(v.f, v.repetir), "Vacuna: " + v.producto, null, {num: v.num || "Hato"}); });
  return ev.filter(e => e.f <= fin).sort((x,y) => x.f - y.f || (y.atras - x.atras));
}

function seccionDosPinos(){
  const fe = D.fertilidad;
  const pr = ORD.filter(a => a.estado === "Preñada");
  const spp = fe ? fe.servicios_por_prenez : avg(pr.map(a => a.servicios).filter(x => x));
  const da = fe ? fe.dias_abiertos : avg(pr.filter(a => a.del_ != null && a.dias_prenez != null).map(a => a.del_ - a.dias_prenez));
  const iep = fe && fe.intervalo_partos_meses ? fe.intervalo_partos_meses*30.4 : da != null ? da + 282 : null;
  const nov = ANIM.filter(a => a.grupo === "Novillas"), novP = nov.filter(a => a.estado === "Preñada");
  const filas = [
    ["Servicios por preñez", spp, 2.2, 2, "L", 1],
    ["Días abiertos", da, 136, 115, "L", 0],
    [fe ? "Intervalo entre partos (días)" : "Intervalo entre partos (estimado)", iep, 419, 390, "L", 0],
    ...(fe && fe.tasa_prenez_21d != null ? [["Tasa de preñez 21 días (%)", fe.tasa_prenez_21d*100, 11.9, 20, "H", 1]] : [])];
  const fmt = (v, d) => v == null || isNaN(v) ? "—" : v.toLocaleString("es-CR", {maximumFractionDigits:d, minimumFractionDigits:d});
  const est = (v, dp, meta, dir) => v == null || isNaN(v) ? ["info","Sin dato"] : (dir === "L" ? v <= meta : v >= meta) ? ["ok","Cumple meta"] : (dir === "L" ? v < dp : v > dp) ? ["ok","Mejor que DP"] : ["alta","Peor que DP"];
  return `<h2>Su finca contra el promedio Dos Pinos</h2>
  <div class="panel"><div class="tablewrap" style="margin-top:0"><table class="t"><thead><tr><th>Indicador</th><th>Su finca</th><th>Dos Pinos</th><th>Meta</th><th></th></tr></thead><tbody>
  ${filas.map(([n, v, dp, meta, dir, d]) => { const [c, l] = est(v, dp, meta, dir); return `<tr><td>${esc(n)}</td><td class="n"><b>${fmt(v, d)}</b></td><td class="n">${fmt(dp, d)}</td><td class="n">${dir === "L" ? "≤" : "≥"} ${fmt(meta, d)}</td><td><span class="pill ${c}">${l}</span></td></tr>`; }).join("")}
  ${nov.length ? `<tr><td>Novillas preñadas</td><td class="n"><b>${pct(novP.length/nov.length)}</b></td><td class="n">—</td><td class="n">—</td><td><span class="pill info">${novP.length} de ${nov.length}</span></td></tr>` : ""}
  </tbody></table></div><p class="note">Promedio Dos Pinos: parámetros de rendimiento de fincas, agosto 2026. Edad al primer parto: Dos Pinos promedia 31,9 meses; la meta es 24 a 26.</p></div>`;
}

/* ================= Recomendaciones de la semana (reglas; con IA si está activada) ================= */
function recomendaciones(){
  const R = [], con = t => ORD.filter(a => a.alertas.some(x => x.tipo === t)), todos = t => ANIM.filter(a => a.alertas.some(x => x.tipo === t));
  const lista = arr => arr.slice(0, 8).map(a => a.num).join(", ") + (arr.length > 8 ? "…" : "");
  const atras = ORD.filter(a => a.alertas.some(x => x.tipo === "Toca secar" && x.sev === "alta"));
  if (atras.length) R.push({sev:"alta", t:"Secar hoy las vacas atrasadas", d:`${atras.length} vacas pasaron su fecha de secado: ${lista(atras)}.`, h:"Secarlas hoy y pasarlas al grupo de secas. Con menos de 50 días secas la próxima lactancia baja y sube el riesgo de mastitis."});
  const sinDx = con("IA sin diagnóstico");
  if (sinDx.length) R.push({sev:"alta", t:"Chequear preñez a las inseminadas viejas", d:`${sinDx.length} vacas llevan más de 60 días inseminadas sin diagnóstico: ${lista(sinDx)}.`, h:"Visita reproductiva fija cada 2 semanas: diagnóstico a los 30–35 días de la inseminación y reconfirmación a los 60–90 días. Muchas ya repitieron celo sin que se viera."});
  const sinServ = con("Sin servicio");
  if (sinServ.length >= 2) R.push({sev:"media", t:"Se están escapando celos", d:`${sinServ.length} vacas abiertas con más de 80 días en leche y sin inseminar: ${lista(sinServ)}.`, h:"Revisar la lista de celos en cada ordeño. Regla mañana–tarde: celo visto en la mañana, inseminar en la tarde; celo de la tarde, inseminar temprano al día siguiente. Las que no muestran celo, al veterinario."});
  const m = mortalidad12();
  if (m != null && m > 0.08) R.push({sev:"alta", t:"Bajar la muerte de terneras", d:`Mortalidad de terneras en 12 meses: ${pct(m)} (meta ≤ 8 %).`, h:"Calostro: 4 litros en las primeras 2 horas. Desinfectar el ombligo, pesar al nacer y cada mes, y anotar cada diarrea o neumonía en Rumia para ver en qué etapa se están perdiendo."});
  const enf = todos("Ternera enferma"), bajas = todos("Crecimiento bajo").concat(todos("Gana poco peso"));
  if (enf.length) R.push({sev:"alta", t:"Terneras enfermas esta semana", d:`${enf.length} terneras con diarrea, neumonía u otro problema en los últimos 14 días: ${lista(enf)}.`, h:"Revisar hidratación y temperatura dos veces al día, separar las enfermas y limpiar baldes y casetas. Si se repite en varias, revisar con el veterinario el calostro y el manejo de los primeros días."});
  if (bajas.length >= 2) R.push({sev:"media", t:"Terneras atrasadas en peso", d:`${new Set(bajas.map(a=>a.num)).size} terneras debajo de su meta o ganando poco: ${lista([...new Map(bajas.map(a=>[a.num,a])).values()])}.`, h:"Meta: duplicar el peso al nacer a los 60 días (unos 0,7 kg por día). Revisar litros de leche, concentrado de inicio desde la primera semana y agua limpia siempre."});
  const pes = todos("Pesaje atrasado");
  if (pes.length >= 3) R.push({sev:"info", t:"Pesar las terneras", d:`${pes.length} terneras sin pesar hace más de 45 días.`, h:"Pesar o medir con cinta una vez al mes. Sin peso no se sabe si la crianza va bien hasta que es tarde."});
  const nov = todos("Novilla sin servicio");
  if (nov.length >= 2) R.push({sev:"media", t:"Novillas atrasadas para inseminar", d:`${nov.length} novillas de 15 meses o más sin preñez: ${lista(nov)}.`, h:"Meta: primer parto a los 24–26 meses (Dos Pinos promedia 31,9). Inseminar a los 13–15 meses si tienen el 55 % del peso adulto."});
  const prep = ORD.filter(a => a.prep_s > U.prep_meta_s);
  if (ORD.length && prep.length/ORD.length >= 0.15) R.push({sev:"media", t:"Mejorar la preparación del ordeño", d:`${prep.length} de ${ORD.length} vacas tardan más de ${U.prep_meta_s} s en llegar al pico de flujo.`, h:"Despunte, limpieza y estimulación; colocar la unidad entre 60 y 90 s después de empezar. Así baja la leche antes y se evita el ordeño en dos tiempos."});
  if (ayerTot != null && semana && (ayerTot - semana)/semana <= -0.05) R.push({sev:"media", t:"Bajó la leche del hato", d:`Ayer ${n0(ayerTot)} L, ${Math.abs((ayerTot-semana)/semana*100).toFixed(1).replace(".",",")} % menos que el promedio de la semana.`, h:"Revisar agua, cambios de alimento o de potrero, calor y el equipo de ordeño (vacío, pulsadores, pezoneras)."});
  const rep = con("Repetidora");
  if (rep.length >= 2) R.push({sev:"media", t:"Revisar vacas repetidoras", d:`${rep.length} vacas con ${U.repetidora_serv} o más servicios sin preñez: ${lista(rep)}.`, h:"Revisión con el veterinario antes de gastar más pajillas. Si no preñan, valorar descarte."});
  const vac = agenda(0).filter(e => e.t.startsWith("Vacuna") && e.atras);
  if (vac.length) R.push({sev:"media", t:"Vacunas vencidas", d: vac.map(e => `${e.t.replace("Vacuna: ","")} (${e.num})`).join(", ") + ".", h:"Aplicar esta semana y anotarlo en Rumia para que la agenda calcule la próxima."});
  return R.sort((x,y) => SEV[y.sev] - SEV[x.sev]);
}
function seccionRecos(){
  const R = recomendaciones(); if (!R.length) return "";
  const card = r => `<div class="reco ${r.sev}"><b>${esc(r.t)}</b><p>${esc(r.d)}</p><p class="h">${esc(r.h)}</p></div>`;
  return `<details class="box" style="margin-top:22px"><summary>Consejos de la semana <span class="pill ${R.some(r=>r.sev==="alta")?"alta":"media"}">${R.length}</span><span class="s">${esc(R.slice(0,2).map(r=>r.t).join(" · "))}</span></summary>
  <div class="in">${R.map(card).join("")}${SAMPLE ? `<div class="actionsrow"><button class="btn ghost" data-q-ia="1">Preguntarle a la IA</button></div>` : ""}</div></details>`;
}

/* ================= Crianza: secciones nuevas ================= */
function seccionesCrianza(T){
  const enf = T.filter(a => a.alertas.some(x => x.tipo === "Ternera enferma"));
  const muertes = SALIDAS.filter(s => s.motivo === "Muerte" && (s.grupo === "Terneras" || (s.edad != null && s.edad < 365)));
  const antes60 = muertes.filter(s => s.edad != null && s.edad < 60);
  const causas = Object.entries(muertes.reduce((m,s) => { const c = (s.causa || "Sin causa").trim(); m[c] = (m[c]||0) + 1; return m; }, {})).sort((a,b) => b[1]-a[1]);
  const conCal = T.filter(a => a.calostro != null);
  let h = "";
  if (enf.length) h += `<h2>Terneras enfermas <span class="count">últimos 14 días</span></h2>${listOf(enf)}`;
  if (muertes.length) h += `<h2>Muertes anotadas <span class="count">${muertes.length}${antes60.length ? ` · ${antes60.length} antes de 60 días` : ""}</span></h2>
    <div class="panel">${causas.map(([c,n]) => `<div class="bar-row"><span>${esc(c)}</span><span class="bar"><span style="width:${n/muertes.length*100}%;background:var(--brand-red)"></span></span><b>${n}</b></div>`).join("")}</div>`;
  if (conCal.length) { const bajos = conCal.filter(a => a.calostro < 4);
    h += `<h2>Calostro <span class="count">${conCal.length} terneras anotadas</span></h2><div class="panel"><p style="margin:0">${bajos.length ? `<b>${bajos.length}</b> recibieron menos de 4 L en las primeras horas: ${bajos.map(a => esc(a.num)).join(", ")}.` : "Todas recibieron 4 L o más. Bien."}</p></div>`; }
  h += `<h2>Protocolo de crianza</h2><div class="panel"><ul class="razones">
    <li class="si">Calostro: 4 litros en las primeras 2 horas de vida (10 % del peso). Anotarlo en el parto.</li>
    <li class="si">Ombligo desinfectado al nacer; caseta limpia y seca; baldes lavados en cada toma.</li>
    <li class="si">Concentrado de inicio y agua desde la primera semana.</li>
    <li class="si">Pesar al nacer y una vez al mes. Meta: duplicar el peso a los 60 días.</li>
    <li class="neutro">Destete cuando come 1 kg de concentrado tres días seguidos. Etapas: inicio a los 2 meses, desarrollo a los 6, novilla a los 13.</li>
    <li class="no">Las primeras 8 semanas son las de más muertes: anotar cada diarrea o neumonía para ver el patrón.</li></ul>
    <div class="actionsrow"><button class="btn" data-anotar-tipo="ternera">Anotar ternera enferma</button><button class="btn ghost" data-anotar-tipo="pesaje">Anotar pesaje</button></div></div>`;
  return h;
}

const ALI = Object.assign({forraje: 8, lpk: 2.5, precio: 330, max: 12}, store.get("ali", {}));
function seccionAlimento(){
  const vacas = ORD.filter(a => a.ayer != null);
  const kg = l => Math.min(ALI.max, Math.max(0, (l - ALI.forraje)/ALI.lpk));
  const niveles = [["Menos de 15 L", 0, 15], ["15 a 25 L", 15, 25], ["Más de 25 L", 25, 999]].map(([n, a, b]) => { const g = vacas.filter(v => v.ayer >= a && v.ayer < b);
    return {n, c: g.length, l: avg(g.map(v => v.ayer)), k: g.length ? avg(g.map(v => kg(v.ayer))) : null, t: g.reduce((s,v) => s + kg(v.ayer), 0)}; });
  const tot = niveles.reduce((s,x) => s + x.t, 0);
  const inp = (id, l, v) => `<label>${l}<input class="field" id="ali-${id}" inputmode="decimal" value="${String(v).replace(".",",")}"></label>`;
  return `<h2>Calculadora de concentrado</h2>
  <div class="panel"><p class="note" style="margin-top:0">Reparte el concentrado según la leche de cada vaca: lo que el pasto no cubre, a razón de un kilo por cada ${String(ALI.lpk).replace(".",",")} litros. Ajuste los números con su nutricionista.</p>
    <div class="form">${inp("forraje","Litros que cubre el pasto", ALI.forraje)}${inp("lpk","Litros por kilo de concentrado", ALI.lpk)}${inp("precio","Precio del kilo (₡)", ALI.precio)}${inp("max","Máximo por vaca (kg/día)", ALI.max)}</div>
    ${vacas.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Producción</th><th>Vacas</th><th>Leche prom.</th><th>Kg/vaca/día</th></tr></thead><tbody>
      ${niveles.map(x => `<tr><td>${x.n}</td><td class="n">${x.c}</td><td class="n">${x.c ? n1(x.l) + " L" : "—"}</td><td class="n"><b>${x.c ? n1(Math.round(x.k*2)/2) : "—"}</b></td></tr>`).join("")}
    </tbody></table></div>
    <div class="kpis" style="margin-top:12px"><div class="kpi"><div class="label">Concentrado por día</div><div class="v">${n0(tot)} <small>kg</small></div><div class="d">${n0(tot*30/46)} sacos de 46 kg al mes</div></div>
      <div class="kpi"><div class="label">Costo por mes</div><div class="v">₡${n0(tot*30*ALI.precio/1000)} <small>mil</small></div><div class="d">₡${n0(ayerTot ? tot*ALI.precio/ayerTot : null)} por litro de leche</div></div></div>`
    : `<p class="empty" style="padding:8px 0 0">Se necesita la leche por vaca (reportes del sistema de ordeño) para repartir el concentrado.</p>`}</div>`;
}

async function preguntarIA(q, idx){
  const msg = chat[idx];
  const hist = chat.slice(Math.max(0, idx - 7), idx - 1).filter(m => !m.pensando).map(m => `${m.de === "me" ? "Productor" : "Rumia"}: ${m.txt}`).join("\n");
  const prompt = `Usted es Rumia, asesor de lechería para fincas de Costa Rica. Responda en ${LANG === "es" ? "español sencillo de Costa Rica" : nombreIdioma() + ", con palabras sencillas"}, corto (máximo 8 líneas), con números de vaca y cifras de los datos. Use solo los datos de abajo; si algo no está, dígalo. No dé diagnósticos veterinarios definitivos ni dosis de medicamentos: sugiera revisar con el veterinario. Sin markdown, use viñetas "•" si hace falta.\n\nDATOS DE HOY:\n${contextoIA()}\n\n${hist ? "CONVERSACIÓN PREVIA:\n" + hist + "\n\n" : ""}PREGUNTA DEL PRODUCTOR: ${q}`;
  try {

    msg.txt = r.text || msg.txt;
  } catch(e){
    if (e && e.code === "not_granted") SAMPLE = null;
    msg.txt = (e && e.code === "rate_limited" ? "La IA está ocupada, pruebe en un minuto. " : "No pude consultar la IA ahora. ") + "Esto es lo que sé:\n" + responder(q).txt;
  }
  msg.pensando = false; render();
  requestAnimationFrame(() => { const c = document.querySelectorAll(".msg"); c[c.length-1]?.scrollIntoView({block:"nearest", behavior:"smooth"}); });
}

}

  const dz = $("#drop"); if (dz){

    dz.ondrop = async e => { e.preventDefault(); dz.classList.remove("over"); leerArchivos(await archivosDeDrop(e.dataTransfer)); }; }

async function archivosDeDrop(dt){
  const items = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!items.length) return dt.files;
  const out = [];
  const recorrer = ent => new Promise(res => {
    if (ent.isFile) ent.file(f => { out.push(f); res(); }, () => res());
    else if (ent.isDirectory){ const rd = ent.createReader(); const todos = [];
      const leer = () => rd.readEntries(async ents => { if (!ents.length){ for (const x of todos) await recorrer(x); res(); } else { todos.push(...ents); leer(); } }, () => res()); leer(); }
    else res(); });
  for (const it of items) await recorrer(it);
  return out;
}
