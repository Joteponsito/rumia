<body>
<title>Rumia Lechería</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de celular centrada; encabezado con logo Dos Banderas, pantallas por pestaña, barra inferior fija. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --sunk:#e8ece5; --ink:#141c17; --muted:#59665e; --line:#d9dfd5;
  --accent:#1c8139; --accent-ink:#ffffff; --brand-red:#d42a2f; --straw:#c27f17; --straw-soft:#f6e9cf;
  --crit:#b9352b; --crit-soft:#f8e0dc; --warn:#a2660c; --warn-soft:#f5e8cf; --ok:#2a7a4c; --ok-soft:#dbefe1; --info:#2d5e8c; --info-soft:#dde7f1;
  --c4:#7a52b3; --c5:#16858a; --c6:#7b7f86; --logo-tile:#ffffff;
  --fert:#8a4fc4; --fert-ink:#5b2a8c; --fert-soft:#efe4fa; --ind1:#e0761b; --ind2:#3d4fb5;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1310; --surface:#161d19; --sunk:#1e2722; --ink:#e6ebe5; --muted:#98a69d; --line:#29342d;
  --accent:#5fcf7d; --accent-ink:#0b1a10; --brand-red:#f06a62; --straw:#e3b55b; --straw-soft:#392d15;
  --crit:#f07f6d; --crit-soft:#3c1e1a; --warn:#e8b45c; --warn-soft:#372912; --ok:#74c995; --ok-soft:#163022; --info:#8db8e2; --info-soft:#192836;
  --c4:#b597e6; --c5:#5cc8cc; --c6:#a3a8ae; --logo-tile:#f4f6f2;
  --fert:#b88ae8; --fert-ink:#dcc6f5; --fert-soft:#2c2038; --ind1:#f5a04f; --ind2:#93a3f5;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1310; --surface:#161d19; --sunk:#1e2722; --ink:#e6ebe5; --muted:#98a69d; --line:#29342d;
  --accent:#5fcf7d; --accent-ink:#0b1a10; --brand-red:#f06a62; --straw:#e3b55b; --straw-soft:#392d15;
  --crit:#f07f6d; --crit-soft:#3c1e1a; --warn:#e8b45c; --warn-soft:#372912; --ok:#74c995; --ok-soft:#163022; --info:#8db8e2; --info-soft:#192836;
  --c4:#b597e6; --c5:#5cc8cc; --c6:#a3a8ae; --logo-tile:#f4f6f2;
  --fert:#b88ae8; --fert-ink:#dcc6f5; --fert-soft:#2c2038; --ind1:#f5a04f; --ind2:#93a3f5;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:600px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Encabezado */
.top{display:flex;align-items:center;gap:12px;padding-block:16px 8px}
.logo{flex:none;background:var(--logo-tile);border-radius:12px;padding:4px 6px;border:1px solid var(--line);display:block}
.logo img{display:block;height:46px;width:auto}
.top .grow{flex:1;min-width:0}
.top h1{font-family:var(--font-display);font-size:1.12rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--muted);font-size:.8rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.src{font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--straw-soft);color:var(--straw)}
.src.real{background:var(--ok-soft);color:var(--ok)}
.iconbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hello{font-family:var(--font-display);font-size:1.65rem;line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:12px 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px}
h2{font-family:var(--font-display);font-size:1.08rem;font-weight:700;margin:26px 0 10px;letter-spacing:-.005em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 .count{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:600}
.label{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .v small{font-family:var(--font-body);font-size:.8rem;font-weight:500;color:var(--muted)}
.kpi .d{font-size:.8rem;margin-top:2px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--crit)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
/* Gráficos interactivos */
.chartbox{position:relative;touch-action:pan-y}
.chart{width:100%;height:auto;display:block;cursor:crosshair;user-select:none;-webkit-user-select:none}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font-body)}
.tip{position:absolute;top:0;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;
  font-size:.8rem;line-height:1.35;min-width:110px;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap}
.tip b{display:block;font-size:.85rem;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lg{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--ink)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.legend.static span{font-size:.8rem;color:var(--muted)} .legend.static i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hint{font-size:.75rem;color:var(--muted);margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--surface);padding:4px 11px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Listas */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.tag{flex:none;min-width:52px;height:40px;padding:0 6px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1rem;background:var(--sunk)}
.tag.alta{background:var(--crit-soft);color:var(--crit)} .tag.media{background:var(--warn-soft);color:var(--warn)}
.tag.info{background:var(--info-soft);color:var(--info)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:.82rem;color:var(--muted)}
.row .end{flex:none;text-align:right;font-size:.82rem;color:var(--muted)}
.row .end b{display:block;color:var(--ink);font-size:.95rem}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px;margin-right:4px;letter-spacing:.02em}
.pill.alta{background:var(--crit-soft);color:var(--crit)} .pill.media{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:16px;color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ask .chips .chip{padding:6px 11px;font-size:.8rem}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;color:var(--ink);margin-bottom:10px}
.bar-row{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:.85rem;padding:5px 0}
.bar{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px}
.note{font-size:.82rem;color:var(--muted);margin-top:8px}
.mini{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;cursor:pointer}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
/* Formularios del explorador y datos */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.03em;min-width:0}
.form select,.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:.9rem;font-weight:500;color:var(--ink);min-width:0}
.form .full{grid-column:1/-1}
.tablewrap{overflow-x:auto;margin-top:8px}

const nA = x => x == null || isNaN(x) ? "—" : Math.abs(x) >= 100 ? n0(x) : x.toLocaleString("es-CR",{maximumFractionDigits:1});
const pct = x => x == null || isNaN(x) ? "—" : (x*100).toLocaleString("es-CR",{maximumFractionDigits:0}) + " %";
const avg = a => { const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; };
const addDays = (dt, k) => { const x = new Date(dt); x.setDate(x.getDate()+k); return x; };
const dm = dt => dt ? String(dt.getDate()).padStart(2,"0") + "/" + String(dt.getMonth()+1).padStart(2,"0") : "—";
const dmy = dt => dm(dt) + "/" + dt.getFullYear();
const iso = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const store = { get(k, d){ try{ const v = localStorage.getItem("rumia."+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },

/* ================= Estado de la app (se recalcula con demo o con los reportes del productor) ================= */
let D, U, HOY, ANIM, ORD, CON_ALERTA, PRIOR, ALTAS, NF, TOT, TOT_MD, TOT_NO, ayerTot, semana, enLeche, FECHAS_D;
const parseDM = s => { if(!s) return null; const [d,m] = s.split("/").map(Number); let y = HOY.getFullYear(); if (m > HOY.getMonth()+1) y--; return new Date(y, m-1, d); };
const daysSince = s => { const p = parseDM(s); return p ? Math.round((HOY - p)/864e5) : null; };
const SEV = {alta:3, media:2, info:1};

function analizar(a){
  const al = [];
  if (a.grupo === "Ordeño"){
    const L = a.leche || [], R = a.rumia || [], n = L.length;
    const ventana = arr => n >= 11 ? arr.slice(n-11, n-4) : n >= 3 ? arr.slice(0, n-1) : [];
    const ayer = n ? L[n-1] : null, base = avg(ventana(L));
    const rAyer = n ? R[n-1] : null, rBase = avg(ventana(R));
    a.ayer = ayer; a.base = base;
    a.dif = (ayer != null && base) ? (ayer - base) / base : null;
    a.rdif = (rAyer != null && rBase) ? (rAyer - rBase) / rBase : null;
    if (a.dif != null && a.dif <= -U.caida_pct/100){
      const conR = a.rdif != null && a.rdif <= -U.rumia_baja_pct/100;
      al.push({sev: (a.dif <= -0.25 || conR) ? "alta" : "media", tipo:"Bajó la leche",
        txt:`${n1(ayer)} L ayer contra ${n1(base)} L de su normal (${Math.round(a.dif*100)} %)` + (conR ? `; rumia ${Math.round(a.rdif*100)} %` : ""),
        rec: conR ? "Revisarla hoy: temperatura, ubre, cascos y si está comiendo." : "Vigilar en el próximo ordeño."});
    } else if (a.rdif != null && a.rdif <= -U.rumia_baja_pct/100){
      al.push({sev:"media", tipo:"Rumia baja", txt:`Rumió ${Math.round(a.rdif*-100)} % menos que su normal`, rec:"Revisar consumo de alimento."});
    }
    a.fert = a.celo ? calcFert(a) : null;
    if (a.fert) al.push({sev: a.fert.estado.sev, tipo: a.fert.estado.clave === "aborto" ? "Sospecha de aborto" : a.fert.falso ? "Posible celo falso" : "Celo", txt: a.fert.estado.corto + (a.fert.falso ? "" : ` · concepción ${a.fert.prob.toLowerCase()}`), rec: a.fert.estado.txt});
    else if (a.actividad_alta) al.push({sev:"alta", tipo:"Posible celo", txt:`Actividad alta${a.del_!=null?`; ${a.del_} días en leche`:""}${a.servicios!=null?`, ${a.servicios} servicio(s)`:""}`, rec:"Confirmar celo e inseminar según la regla mañana–tarde."});
    if (a.tratamiento && a.tratamiento.retiro_dias > 0){
      const libre = parseDM(a.tratamiento.libre);
      if (libre >= HOY) al.push({sev:"alta", tipo:"Leche en retiro", txt:`${a.tratamiento.motivo}; desde ${a.tratamiento.inicio}`, rec:`No mandar su leche al tanque hasta el ${a.tratamiento.libre}.`});
    } else if (a.tratamiento){
      al.push({sev:"info", tipo:"En tratamiento", txt:`${a.tratamiento.motivo}${a.tratamiento.inicio?`; desde ${a.tratamiento.inicio}`:""}`, rec:"Seguir el plan del veterinario y confirmar si hay retiro de leche."});
    }
    if (a.estado === "Preñada" && a.dias_prenez >= U.secado_dias) al.push({sev:"media", tipo:"Toca secar", txt:`${a.dias_prenez} días de preñez`, rec:"Secar esta semana y pasar al grupo de secas."});
    if (a.estado !== "Preñada" && a.servicios >= U.repetidora_serv) al.push({sev:"media", tipo:"Repetidora", txt:`${a.servicios} servicios sin preñez${a.del_!=null?`; ${a.del_} días en leche`:""}`, rec:"Revisión reproductiva con el veterinario."});
    if (a.estado === "Inseminada" && a.ultima_ia){ const d = daysSince(a.ultima_ia); a.dias_ia = d;
      if (d >= U.diag_prenez_dias) al.push({sev:"info", tipo:"Diagnóstico de preñez", txt:`Inseminada hace ${d} días (${a.ultima_ia})`, rec:"Incluir en la próxima palpación o ultrasonido."}); }
    if (a.cc != null && a.cc <= 2.5 && a.del_ != null && a.del_ < 60) al.push({sev:"media", tipo:"Condición corporal baja", txt:`CC ${String(a.cc).replace(".",",")} con ${a.del_} días en leche`, rec:"Revisar dieta del grupo de inicio de lactancia."});
    if (a.temp_corp != null && a.temp_corp >= 39.5) al.push({sev: a.temp_corp >= 40 ? "alta" : "media", tipo:"Temperatura alta", txt:`${String(a.temp_corp).replace(".",",")} °C`, rec:"Revisar a la vaca: posible fiebre (mastitis, metritis, neumonía) o estrés calórico."});
    if (a.prep_s > U.prep_meta_s) al.push({sev:"info", tipo:"Preparación lenta", txt:`${a.prep_s} s hasta el pico de flujo (meta ≤ ${U.prep_meta_s} s)`, rec:"Revisar rutina de despunte y estimulación."});
  }
  if ((a.grupo === "Secas" || a.grupo === "Novillas") && a.estado === "Preñada" && a.dias_prenez != null){
    a.parto = addDays(HOY, U.parto_dias - a.dias_prenez);
    const falta = U.parto_dias - a.dias_prenez;
    if (a.grupo === "Secas" && falta <= 14) al.push({sev: falta <= 5 ? "alta" : "media", tipo:"Parto próximo", txt:`Parto estimado ${dm(a.parto)} (${falta} días)`, rec:"Pasar a preparto y vigilar."});
  }
  if (a.grupo === "Terneras" && a.peso && a.meta){
    a.ratio = a.peso / a.meta;
    if (a.ratio < 0.9) al.push({sev: a.ratio < 0.85 ? "alta" : "media", tipo:"Crecimiento bajo", txt:`${a.peso} kg contra meta de ${a.meta} kg a los ${a.edad_dias} días`, rec:"Revisar consumo de leche y concentrado, y salud respiratoria."});
  }
  al.sort((x,y) => SEV[y.sev] - SEV[x.sev]);
  a.alertas = al;
  a.score = al.reduce((s,x) => s + (x.sev==="alta"?10:x.sev==="media"?4:1), 0);
  a.sev = al.length ? al[0].sev : null;
  return a;
}

function cargar(data){
  D = data; U = D.umbrales;
  { const [d,m,y] = D.hoy.split("/").map(Number); HOY = new Date(y, m-1, d); }
  FECHAS_D = D.fechasISO ? D.fechasISO.map(s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); })
                         : D.fechas.map(s => parseDM(s));
  AHORA = D.ahora ? new Date(D.ahora) : (() => { const [hh,mm] = (D.hora_reporte || "06:00").split(":").map(Number); const x = new Date(HOY); x.setHours(hh, mm, 0, 0); return x; })();
  CLIMA = prepararClima(D.clima, D.climaFuente || (D.fuente === "import" ? "vivo" : "demo"));
  ANIM = D.animales; ANIM.forEach(a => a.num = String(a.num));
  ORD = ANIM.filter(a => a.grupo === "Ordeño");
  ANIM.forEach(analizar);
  CON_ALERTA = ANIM.filter(a => a.alertas.length).sort((x,y)=>y.score-x.score);
  PRIOR = CON_ALERTA.filter(a => a.alertas.some(x => x.sev !== "info"));
  ALTAS = CON_ALERTA.filter(a => a.sev === "alta");
  NF = D.fechas.length;
  const sumDia = (k, i) => { let s = 0, hay = false; ORD.forEach(a => { const v = a[k] && a[k][i]; if (v != null){ s += v; hay = true; } }); return hay ? s : null; };
  TOT = D.fechas.map((_,i)=>sumDia("leche", i));
  TOT_MD = D.fechas.map((_,i)=>sumDia("md", i));
  TOT_NO = D.fechas.map((_,i)=>sumDia("no", i));
  ayerTot = NF ? TOT[NF-1] : null;
  semana = NF >= 2 ? avg(TOT.slice(Math.max(0,NF-8), NF-1)) : null;
  enLeche = NF ? ORD.filter(a => a.leche && a.leche[NF-1] != null).length : 0;
  D.tablas = (D.tablasCrudas || []).concat(tablasDerivadas());
  EX.t = 0; EX.m = null; EX.preset = null; PRESET_CACHE = null;
}

/* ================= Gráficos interactivos ================= */
const CH = {}; let chN = 0;
const PAL = ["var(--accent)","var(--straw)","var(--info)","var(--c4)","var(--c5)","var(--c6)","var(--brand-red)"];
function niceStep(r){ const p = Math.pow(10, Math.floor(Math.log10(r||1))); const m = r/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
function chart(spec){
  const id = "c" + (++chN); CH[id] = spec;
  spec.series.forEach(s => { if (s.on === undefined) s.on = true; });
  const leg = spec.series.length > 1 ? `<div class="legend">${spec.series.map((s,i)=>`<button class="lg" data-serie="${id}:${i}" aria-pressed="${s.on}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`).join("")}</div>` : "";
  return `<div class="chartbox" data-chart="${id}"><div class="svgw">${dibujar(spec)}</div><div class="tip" hidden></div>${leg}</div>`;
}
function dibujar(spec){
  const W = Math.round(Math.min(560, Math.max(300, (window.innerWidth || 560) - 64))), H = Math.round((spec.h || 210) * Math.max(0.8, W/560)), P = {l:44, r:12, t:14, b:28};
  const vis = spec.series.filter(s => s.on);
  const n = spec.labels.length;
  const vals = vis.flatMap(s => s.data).filter(v => v != null && !isNaN(v));
  if ((!vals.length && !spec.fixed) || !n){ spec._geo = null; return `<svg class="chart" viewBox="0 0 ${W} 60"><text x="${W/2}" y="34" text-anchor="middle">Sin datos para mostrar</text></svg>`; }
  const bar = spec.type === "bar";
  let mx = vals.length ? Math.max(...vals) : 1, mn = vals.length ? ((bar || spec.zero) ? Math.min(0, ...vals) : Math.min(...vals)) : 0;
  if (mx === mn){ mx = mx + Math.max(1, Math.abs(mx)*0.1); if (!bar) mn = mn - Math.max(1, Math.abs(mn)*0.1); }
  let step = niceStep((mx-mn)/4); mn = Math.floor(mn/step)*step; mx = Math.ceil(mx/step)*step;
  if (spec.fixed){ mn = spec.fixed[0]; mx = spec.fixed[1]; step = spec.fixed[2] || niceStep((mx-mn)/5); }
  const iw = W-P.l-P.r, ih = H-P.t-P.b, band = iw / n;
  const X = i => bar ? P.l + band*i + band/2 : P.l + (n === 1 ? iw/2 : i*iw/(n-1));
  const Y = v => P.t + (1-(v-mn)/(mx-mn))*ih;
  let g = "";
  if (spec.band) g += `<rect x="${X(spec.band[0])}" y="${P.t}" width="${Math.max(0,X(spec.band[1])-X(spec.band[0]))}" height="${ih}" fill="var(--straw)" fill-opacity=".12"/>`;
  const geo0 = {W, H, P, n, X, Y, band, bar, iw, ih, mn, mx};
  if (spec.fondo) g += spec.fondo(geo0);
  for (let v = mn; v <= mx + 1e-9; v += step) g += `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${nA(v)}</text>`;
  if (spec.under) g += spec.under(geo0);
  const cada = spec.cada || Math.max(1, Math.ceil(n / (bar ? Math.max(4, Math.floor(W/62)) : Math.max(3, Math.floor(W/95)))));
  for (let i = 0; i < n; i++){
    if (spec.cada){ if (i % spec.cada) continue; }
    else { if (i % cada && i !== n-1) continue; if (!bar && i !== n-1 && n-1-i < cada) continue; }
    let t = String(spec.labels[i]); if (bar && t.length > 9) t = t.slice(0,8) + "…";
    const anc = bar || spec.cada ? "middle" : i === 0 ? "start" : i === n-1 ? "end" : "middle";
    g += `<text x="${X(i)}" y="${H-8}" text-anchor="${anc}">${esc(t)}</text>`;
  }
  g += `<rect class="hl" x="0" y="${P.t}" width="${band}" height="${ih}" fill="var(--ink)" fill-opacity=".06" visibility="hidden"/>`;
  if (bar){
    const gw = band*0.74, bw = gw / vis.length;
    vis.forEach((s, k) => s.data.forEach((v, i) => { if (v == null || isNaN(v)) return;
      const x = X(i) - gw/2 + k*bw, y0 = Y(0), y = Y(v);
      g += `<rect x="${x.toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${Math.max(1,bw-1.5).toFixed(1)}" height="${Math.abs(y0-y).toFixed(1)}" rx="3" fill="${s.color}"/>`; }));
  } else {
    vis.forEach(s => {
      let d = "", pen = false, first = null, last = null;
      s.data.forEach((v, i) => { if (v == null || isNaN(v)){ pen = false; return; } const p = [X(i), Y(v)]; d += (pen ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); pen = true; if (!first) first = p; last = p; });
      if (!d) return;
      if (s.fill && first) g += `<path d="${d}L${last[0]},${Y(Math.max(mn,0))}L${first[0]},${Y(Math.max(mn,0))}Z" fill="${s.color}" fill-opacity=".13"/>`;
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (last) g += `<circle cx="${last[0]}" cy="${last[1]}" r="3.6" fill="${s.color}"/>`;
    });
    g += `<line class="guide" x1="0" x2="0" y1="${P.t}" y2="${P.t+ih}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><g class="dots"></g>`;
  }
  if (spec.over) g += spec.over(geo0);
  spec._geo = {W, H, P, n, X, Y, band, bar, iw};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria||"Gráfico")}">${g}</svg>`;
}
function onPtr(e){
  const box = e.target.closest ? e.target.closest(".chartbox") : null;
  document.querySelectorAll(".chartbox[data-act]").forEach(b => { if (b !== box) ocultarTip(b); });
  if (!box) return;
  const svg = box.querySelector("svg.chart"); if (!svg || !svg.contains(e.target)) { ocultarTip(box); return; }
  const spec = CH[box.dataset.chart], g = spec && spec._geo; if (!g) return;
  const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * g.W;
  let i = g.bar ? Math.floor((x - g.P.l) / g.band) : Math.round((x - g.P.l) / (g.n === 1 ? 1 : g.iw/(g.n-1)));
  i = Math.max(0, Math.min(g.n-1, i));
  const vis = spec.series.filter(s => s.on);
  const hl = svg.querySelector(".hl"), guide = svg.querySelector(".guide"), dots = svg.querySelector(".dots");
  if (g.bar){ hl.setAttribute("x", g.X(i) - g.band/2); hl.setAttribute("visibility","visible"); }
  else { guide.setAttribute("x1", g.X(i)); guide.setAttribute("x2", g.X(i)); guide.setAttribute("visibility","visible");
    dots.innerHTML = vis.map(s => s.data[i] == null || isNaN(s.data[i]) ? "" : `<circle cx="${g.X(i)}" cy="${g.Y(s.data[i])}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join(""); }
  const tip = box.querySelector(".tip");
  const u = spec.unit ? " " + spec.unit : "";
  tip.innerHTML = `<b>${esc(spec.full ? spec.full[i] : spec.labels[i])}</b>` + vis.map(s => `<div><i style="background:${s.color}"></i>${esc(s.name)}: <strong>${s.data[i]==null||isNaN(s.data[i])?"—":nA(s.data[i])+u}</strong></div>`).join("") + (spec.extra ? spec.extra(i) : "");
  tip.hidden = false; box.dataset.act = "1";
  const bw = box.clientWidth, px = g.X(i) / g.W * r.width + (r.left - box.getBoundingClientRect().left), tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(bw - tw, px > bw/2 ? px - tw - 12 : px + 12)) + "px";
}
function ocultarTip(box){ delete box.dataset.act; const t = box.querySelector(".tip"); if (t) t.hidden = true;
  box.querySelectorAll(".guide,.hl").forEach(el => el.setAttribute("visibility","hidden")); const d = box.querySelector(".dots"); if (d) d.innerHTML = ""; }
document.addEventListener("pointermove", onPtr);
document.addEventListener("pointerdown", onPtr);
function toggleSerie(ref){
  const [id, k] = ref.split(":"); const spec = CH[id]; if (!spec) return;
  const s = spec.series[+k]; if (s.on && spec.series.filter(x=>x.on).length === 1) return toast("Debe quedar al menos una serie visible.");
  s.on = !s.on; const box = document.querySelector(`.chartbox[data-chart="${id}"]`);
  box.querySelector(".svgw").innerHTML = dibujar(spec);
  box.querySelector(`[data-serie="${ref}"]`).setAttribute("aria-pressed", s.on);
  if (spec.onToggle) spec.onToggle(+k, s.on);
}

/* ================= Ventana de fertilidad con las medidas de SCR (collares de actividad y rumia) =================
   Fuente: presentación "La Reproducción y la Detección de Celos" (SCR by Allflex).
   - El reloj se cuenta desde el PICO de actividad.
   - Tiempo para la IA: 0 a 26 h después del pico. Tiempo óptimo: 3 a 18 h. Ovulación: 28 a 30 h.
   - "Horas para la inseminación" = horas que quedan de las 26: ≥24 temprano, 10–23 óptimo, 0–9 últimas horas, ≤ -1 cerrada.
   - Alta actividad: cambio de actividad ≥ 30. En el celo la rumia baja.
   - Índice de celo (0 a 100): pico de actividad, caída de rumia, duración del celo y días desde el último celo. Verde desde 32. */
const HORA = 3600e3;
let AHORA = null;
const SCR = {alta:30, total:26, optIni:3, optFin:18, maxIni:8, maxFin:16, ovuIni:28, ovuFin:30, indiceVerde:32};
// Tasa de concepción según horas desde el pico (promedio de las 4 granjas de la presentación de SCR)
const CONCEP = [[-12,12],[-4,22],[4,43],[12,44],[20,38],[30,32],[42,20]];
function concepcionEn(hDesdePico){
  if (hDesdePico <= CONCEP[0][0]) return CONCEP[0][1];
  for (let i = 1; i < CONCEP.length; i++){ const [x1,y1] = CONCEP[i-1], [x2,y2] = CONCEP[i];
    if (hDesdePico <= x2) return y1 + (y2-y1) * (hDesdePico-x1)/(x2-x1); }
  return CONCEP[CONCEP.length-1][1];
}
const hm = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
const DIAS_SEM = ["dom","lun","mar","mié","jue","vie","sáb"];
const cuando = d => { const dd = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(AHORA.getFullYear(),AHORA.getMonth(),AHORA.getDate()))/864e5);
  return (dd === 0 ? "hoy" : dd === -1 ? "ayer" : dd === 1 ? "mañana" : DIAS_SEM[d.getDay()] + " " + dm(d)) + " a las " + hm(d); };
const diaHora = d => { const dd = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(AHORA.getFullYear(),AHORA.getMonth(),AHORA.getDate()))/864e5);
  return (dd === 0 ? "hoy" : dd === -1 ? "ayer" : dd === 1 ? "mañana" : DIAS_SEM[d.getDay()] + " " + dm(d)) + " " + hm(d); };
function horasTexto(h){ h = Math.max(0, h); if (h < 1) return Math.round(h*60) + " min"; return Math.round(h) + " h"; }
function tipoCiclo(d){
  if (d == null) return null;
  if (d <= 4) return {txt:"inseminación doble (1 a 4 días)", ok:false};
  if (d <= 17) return {txt:"ciclo corto (5 a 17 días)", ok:false};
  if (d <= 25) return {txt:"ciclo normal (18 a 25 días)", ok:true};
  if (d <= 35) return {txt:"ciclo largo (26 a 35 días)", ok:null};
  if (d <= 60) return {txt:"ciclo doble (36 a 60 días): probablemente no se vio un celo", ok:null};
  return {txt:"más de 60 días sin celo registrado", ok:null};
}
function calcFert(a){
  const c = a.celo; if (!c) return null;
  const F = {razones: [], fuente: "serie"};
  const R = (ok, txt) => F.razones.push({ok, txt});
  let pico = null, inicio = null, durH = null, picoAct = c.max1 ?? null, picoRum = c.rumia_pico ?? null, t0 = null;
  if (c.ind1 && c.ind1.length){
    t0 = new Date(AHORA - (c.ind1.length - 1) * HORA);
    const n = c.ind1.length, desde = Math.max(0, n - 49);
    // el celo más reciente: el último bloque en alta actividad, y su punto más alto
    let ult = -1; for (let i = n-1; i >= desde; i--) if (c.ind1[i] >= SCR.alta){ ult = i; break; }
    if (ult < 0) return null;
    let b0 = ult; while (b0 > desde && c.ind1[b0-1] >= SCR.alta - 10) b0--;

function maxCalor(t1, t2){ if (!CLIMA) return null; let best = null;
  for (let t = +t1; t <= +t2; t += HORA){ const c = climaEn(new Date(t)); if (c && c.hi != null && (!best || c.hi > best.hi)) best = {...c, t: new Date(t)}; } return best; }
function franjaRiesgo(dia, umbral){ // horas del día con índice de calor ≥ umbral
  const ini = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate()); let a = null, b = null;
  for (let h = 0; h < 24; h++){ const c = climaEn(new Date(+ini + h*HORA)); if (c && c.hi >= umbral){ if (a == null) a = h; b = h; } }
  return a == null ? null : {desde: a, hasta: b + 1};
}
function resumenCalorHoy(){
  if (!CLIMA) return null;
  const hoy0 = new Date(AHORA.getFullYear(), AHORA.getMonth(), AHORA.getDate());
  const mx = maxCalor(hoy0, new Date(+hoy0 + 23*HORA)); if (!mx) return null;
  const niv = nivelCalor(mx.hi), fr = franjaRiesgo(hoy0, NIVELES_CALOR[2].min) || franjaRiesgo(hoy0, NIVELES_CALOR[1].min);
  return {mx, niv, fr, ahora: climaEn(AHORA)};
}
// Datos por día: índice de calor máximo, rumia y leche del hato
function diasCalor(){
  if (!CLIMA || !NF) return [];
  return FECHAS_D.map((f, i) => { const mx = maxCalor(f, new Date(+f + 23*HORA));
    const rum = avg(ORD.map(a => a.rumia ? a.rumia[i] : null)), lv = enLeche ? avg(ORD.map(a => a.leche ? a.leche[i] : null)) : null;
    let tmax = null, hmin = null; for (let h = 0; h < 24; h++){ const c = climaEn(new Date(+f + h*HORA)); if (c){ tmax = tmax == null ? c.temp : Math.max(tmax, c.temp); hmin = hmin == null ? c.hr : Math.min(hmin, c.hr); } }
    return {f, i, hiMax: mx ? mx.hi : null, tmax, hmin, rumia: rum, lechePorVaca: lv, total: TOT[i]}; });
}

async function cargarClimaVivo(){
  const ub = store.get("ubicacion", null); if (!ub) return;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${ub.lat}&longitude=${ub.lon}&hourly=temperature_2m,relative_humidity_2m&past_days=30&forecast_days=2&timezone=America%2FCosta_Rica`;
    const r = await fetch(url); if (!r.ok) return; const j = await r.json();
    if (!j.hourly || !j.hourly.time) return;
    CLIMA_VIVO = {inicio: j.hourly.time[0], temp: j.hourly.temperature_2m, hr: j.hourly.relative_humidity_2m, lugar: ub.nombre};
    if (D.fuente === "import" || store.get("climaDemoReal", false)){ D.clima = CLIMA_VIVO; D.climaFuente = "vivo"; cargar(D); render(); }
  } catch(e){}
}

      const ex = {m: p.m === "#conteo" ? "#conteo" : r[p.m], m2: p.m2 ? r[p.m2] : null, por: r[p.por], sep: p.sep ? r[p.sep] : "", calc: p.calc};
      let res; try { res = calcularExplorador(t, ex); } catch(e){ continue; }
      const datos = res.series.some(s => s.data.filter(v => v != null && v !== 0).length);

    else if ((tp === "texto" || tp === "num") && card(t,j) <= 60 && card(t,j) >= 1) por.push(c);
    if ((tp === "texto" || (tp === "num" && card(t,j) <= 8)) && card(t,j) <= 12 && card(t,j) >= 2) sep.push(c); });

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function textoParaVoz(txt){
  return txt.replace(/•/g, "")
    .replace(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/g, (m, d, mo) => +mo >= 1 && +mo <= 12 ? `${+d} de ${MESES[+mo-1]}` : m)
    .replace(/\bLact\.\s*/g, "lactancia ").replace(/\blact\.\s*/g, "lactancia ")
    .replace(/\bDEL\b/g, "días en leche").replace(/\bCC\b/g, "condición corporal").replace(/\bIA\b/g, "inseminación")
    .replace(/(\d) (L|kg|s|min|d)(?![\wáéíóúñ])/g, (m, n, u) => n + " " + ({L:"litros", kg:"kilos", s:"segundos", min:"minutos", d:"días"})[u])
    .replace(/-(\d+) %/g, "menos $1 por ciento").replace(/ ?%/g, " por ciento")
    .replace(/≤/g, "menor o igual a").replace(/×/g, " cruce ").replace(/ — /g, ", ").replace(/ · /g, ". ")
    .replace(/\s*\(/g, ", ").replace(/\)/g, "").replace(/\s*,\s*([;.:])/g, "$1").replace(/\s+,/g, ",");
}
function trozos(txt){
  return textoParaVoz(txt).split(/\n+/).flatMap(l => l.split(/(?<=[.;:!?])\s+/)).map(s => s.replace(/^[\s,]+|[\s,]+$/g, "")).filter(s => /[a-z0-9áéíóúñ]/i.test(s));
}
function vocesES(){ try { return speechSynthesis.getVoices().filter(v => /^es\b|^es[-_]/i.test(v.lang)); } catch(e){ return []; } }
function puntajeVoz(v){
  let s = 0; const n = v.name, l = v.lang.replace("_","-");
  if (/es-CR/i.test(l)) s += 50; else if (/es-(419|MX|US|CO|PA|GT|HN|NI|SV|PE|CL|AR|UY|VE|EC|BO|PY|DO|PR|CU)/i.test(l)) s += 25; else if (/es-ES/i.test(l)) s += 8;
  if (/natural|neural|online|enhanced|premium|mejorad/i.test(n)) s += 45; if (/google/i.test(n)) s += 22; if (/siri|paulina|m[oó]nica|juan|diego|sabina|marisol/i.test(n)) s += 10;
  return s;
}
function mejorVoz(){
  const vs = vocesES(); if (!vs.length) return null;
  const elegida = store.get("voz", ""); const v = vs.find(x => x.name === elegida);
  return v || vs.slice().sort((a,b) => puntajeVoz(b) - puntajeVoz(a))[0];

let hablandoBtn = null, colaVoz = [], vozId = 0;
const TTS = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech;
function detenerVoz(){ vozId++; colaVoz = []; try { if (TTS()) TTS().stop(); else speechSynthesis.cancel(); } catch(e){} if (hablandoBtn){ hablandoBtn.textContent = "▶ Escuchar"; hablandoBtn = null; } }
function hablar(txt, btn){
  if (TTS()){
    if (btn && btn === hablandoBtn){ detenerVoz(); return; }
    detenerVoz(); const id = vozId, tts = TTS(), vel = store.get("vozVel", 0.95); colaVoz = trozos(txt);
    if (btn){ hablandoBtn = btn; btn.textContent = "■ Detener"; }
    const sig = async () => { if (id !== vozId) return; const frase = colaVoz.shift();
      if (frase == null){ if (btn && hablandoBtn === btn){ btn.textContent = "▶ Escuchar"; hablandoBtn = null; } return; }
      try { await tts.speak({text: frase, lang: "es-US", rate: vel, pitch: 1.0, volume: 1.0, category: "playback"}); } catch(e){}
      if (id === vozId) setTimeout(sig, /[,;]$/.test(frase) ? 150 : 320); };
    sig(); return;
  }
  let s; try { s = window.speechSynthesis; if (!s) throw 0; } catch(e){ return toast("Este navegador no tiene voz disponible."); }
  if (btn && btn === hablandoBtn){ detenerVoz(); return; }
  detenerVoz();
  const id = vozId, voz = mejorVoz(), vel = store.get("vozVel", 0.95);
  colaVoz = trozos(txt);
  if (btn){ hablandoBtn = btn; btn.textContent = "■ Detener"; }
  const siguiente = () => {
    if (id !== vozId) return;
    const frase = colaVoz.shift();
    if (frase == null){ if (hablandoBtn === btn && btn){ btn.textContent = "▶ Escuchar"; hablandoBtn = null; } return; }
    const u = new SpeechSynthesisUtterance(frase);
    if (voz){ u.voice = voz; u.lang = voz.lang; } else u.lang = "es-CR";
    u.rate = vel; u.pitch = 1;
    const pausa = /[.:!?]$/.test(frase) || !/[,;]$/.test(frase) ? 420 : 220;
    u.onend = () => setTimeout(siguiente, pausa); u.onerror = () => setTimeout(siguiente, 50);
    s.speak(u);
  };
  siguiente();
}

async function archivosDeDrop(dt){

      const leer = () => rd.readEntries(async ents => { if (!ents.length){ for (const x of todos) await recorrer(x); res(); } else { todos.push(...ents); leer(); } }, () => res()); leer(); }
    else res(); });
